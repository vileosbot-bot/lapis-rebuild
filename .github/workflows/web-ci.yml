# S24 final acceptance trigger: 2026-09-19
name: Web and parser validation
on:
  push:
    branches: ['codex/**', 'feat/ch1-m73-wild-encounters']
    paths: ['web/**', 'tools/**', 'tests/**', 'data/**', 'manifests/**', '.github/workflows/web-ci.yml']
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: web-ci-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  synthetic:
    permissions:
      contents: read
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Python parser unit tests
        id: parser-unit
        timeout-minutes: 5
        continue-on-error: true
        run: python3 tools/gate/check_gate.py run --log "$RUNNER_TEMP/agent-ops-gate/parser-unit.log" --fallback-file .github/workflows/web-ci.yml --fallback-line 1 -- python3 -m unittest discover -s tests/parsers -v
      - name: Run nine reverse tests
        id: gate-self-test
        if: always()
        timeout-minutes: 3
        continue-on-error: true
        run: |
          mkdir -p "$RUNNER_TEMP/agent-ops-gate"
          set +e
          python3 tools/gate/check_gate.py self-test > "$RUNNER_TEMP/agent-ops-gate/reverse-tests.log" 2>&1
          status=$?
          cat "$RUNNER_TEMP/agent-ops-gate/reverse-tests.log"
          exit "$status"
      - name: Generate synthetic web fixture
        id: synthetic-pack
        timeout-minutes: 5
        continue-on-error: true
        run: python3 tools/gate/check_gate.py run --log "$RUNNER_TEMP/agent-ops-gate/synthetic-pack.log" --fallback-file tools/testing/make_web_fixture.py --fallback-line 1 -- python3 tools/testing/make_web_fixture.py --out web/public/game-data
      - name: Install locked Web dependencies
        id: deps
        working-directory: web
        timeout-minutes: 10
        continue-on-error: true
        run: python3 ../tools/gate/check_gate.py run --log "$RUNNER_TEMP/agent-ops-gate/npm-ci.log" --cwd web --fallback-file web/package-lock.json --fallback-line 1 -- npm ci --ignore-scripts
      - name: TypeScript typecheck
        id: typecheck
        if: steps.deps.outcome == 'success'
        working-directory: web
        timeout-minutes: 5
        continue-on-error: true
        run: python3 ../tools/gate/check_gate.py run --log "$RUNNER_TEMP/agent-ops-gate/typecheck.log" --cwd web --fallback-file web/tsconfig.json --fallback-line 1 -- npm run typecheck
      - name: Web unit tests
        id: web-unit
        if: steps.deps.outcome == 'success'
        working-directory: web
        timeout-minutes: 10
        continue-on-error: true
        run: python3 ../tools/gate/check_gate.py run --log "$RUNNER_TEMP/agent-ops-gate/web-unit.log" --cwd web --fallback-file web/package.json --fallback-line 1 -- npm test
      - name: Production build
        id: build
        if: steps.deps.outcome == 'success'
        working-directory: web
        timeout-minutes: 10
        continue-on-error: true
        run: python3 ../tools/gate/check_gate.py run --log "$RUNNER_TEMP/agent-ops-gate/build.log" --cwd web --fallback-file web/vite.config.ts --fallback-line 1 -- npm run build
      - name: Install Chromium
        id: playwright-install
        if: steps.build.outcome == 'success'
        working-directory: web
        timeout-minutes: 10
        continue-on-error: true
        run: python3 ../tools/gate/check_gate.py run --log "$RUNNER_TEMP/agent-ops-gate/playwright-install.log" --cwd web --fallback-file web/playwright.config.ts --fallback-line 1 -- npx playwright install --with-deps chromium
      - name: Build standalone synthetic preview
        id: standalone-preview
        if: steps.build.outcome == 'success' && steps.synthetic-pack.outcome == 'success'
        timeout-minutes: 5
        continue-on-error: true
        shell: bash
        run: |
          mkdir -p web/test-results web/ci-pack-builder
          python3 tools/gate/check_gate.py run --log "$RUNNER_TEMP/agent-ops-gate/standalone-preview.log" --fallback-file tools/package_web_preview.py --fallback-line 1 -- python3 tools/package_web_preview.py --dist web/dist --pack web/public/game-data --out "$RUNNER_TEMP/offline.html"
          cp "$RUNNER_TEMP/agent-ops-gate/standalone-preview.log" web/test-results/m7-standalone-synthetic.log
          cp "$RUNNER_TEMP/offline.html" web/test-results/lapis-m7-synthetic.html
          cp "$RUNNER_TEMP/offline.html" web/ci-pack-builder/lapis-m7-synthetic.html
          tar -czf web/ci-pack-builder/m7-private-pack-builder.tar.gz tools manifests web/THIRD_PARTY_NOTICES.txt
      - name: Publish current-code private pack builder before Playwright cleanup
        if: steps.standalone-preview.outcome == 'success'
        timeout-minutes: 5
        continue-on-error: true
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: m7-private-pack-builder
          path: web/ci-pack-builder/
          retention-days: 3
          if-no-files-found: error
      - name: Chromium integration and offline tests
        id: chromium-e2e
        if: steps.playwright-install.outcome == 'success' && steps.standalone-preview.outcome == 'success'
        working-directory: web
        timeout-minutes: 25
        continue-on-error: true
        env:
          LAPIS_OFFLINE_PREVIEW: ${{ runner.temp }}/offline.html
        run: python3 ../tools/gate/check_gate.py run --log "$RUNNER_TEMP/agent-ops-gate/chromium-e2e.log" --cwd web --fallback-file web/playwright.config.ts --fallback-line 1 -- npm run test:e2e -- --workers=2
      - name: S41 M7.1 final acceptance
        id: s41-e2e
        if: (github.ref_name == 'codex/s41-m7-1-final-glue' || github.head_ref == 'codex/s41-m7-1-final-glue') && steps.playwright-install.outcome == 'success' && steps.standalone-preview.outcome == 'success'
        working-directory: web
        timeout-minutes: 8
        continue-on-error: true
        env:
          LAPIS_OFFLINE_PREVIEW: ${{ runner.temp }}/offline.html
          S41_M7_1_FINAL: '1'
        run: python3 ../tools/gate/check_gate.py run --log "$RUNNER_TEMP/agent-ops-gate/s41-e2e.log" --cwd web --fallback-file web/e2e/s41-m7-1-acceptance.spec.ts --fallback-line 1 -- npm run test:e2e -- e2e/s41-m7-1-acceptance.spec.ts
      - name: Build M7.3 synthetic Chapter 1 test pack (no original assets)
        id: m73-fixture
        if: steps.synthetic-pack.outcome == 'success'
        timeout-minutes: 5
        continue-on-error: true
        run: |
          rm -rf web/public/game-data
          python3 tools/gate/check_gate.py run --log "$RUNNER_TEMP/agent-ops-gate/m73-fixture.log" --fallback-file tools/testing/make_ch1_wild_fixture.py --fallback-line 1 -- python3 tools/testing/make_ch1_wild_fixture.py --out web/public/game-data
      - name: Build M7.3 synthetic Chapter 1 preview
        id: m73-build
        if: steps.m73-fixture.outcome == 'success' && steps.deps.outcome == 'success'
        working-directory: web
        timeout-minutes: 8
        continue-on-error: true
        run: python3 ../tools/gate/check_gate.py run --log "$RUNNER_TEMP/agent-ops-gate/m73-build.log" --cwd web --fallback-file web/vite.config.ts --fallback-line 1 -- npm run build
      - name: M7.3 map 1020 wild encounter browser acceptance (synthetic maps; S42 not run)
        id: m73-e2e
        if: steps.m73-build.outcome == 'success' && steps.playwright-install.outcome == 'success'
        working-directory: web
        timeout-minutes: 10
        continue-on-error: true
        env:
          M73_WILD_SYNTHETIC_ACCEPTANCE: '1'
          LAPIS_OFFLINE_PREVIEW: ${{ runner.temp }}/offline.html
        run: |
          command -v fuser >/dev/null 2>&1 || { echo "fuser is required to clean up a timed-out Playwright preview server"; exit 1; }
          fuser -k 4173/tcp || true
          python3 ../tools/gate/check_gate.py run --log "$RUNNER_TEMP/agent-ops-gate/m73-e2e.log" --cwd web --fallback-file web/e2e/ch1-wild-encounters.spec.ts --fallback-line 1 -- npm run test:e2e -- e2e/ch1-wild-encounters.spec.ts
      - name: Format check
        id: gate-format
        if: always()
        timeout-minutes: 3
        continue-on-error: true
        env:
          GATE_BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before || github.event.repository.default_branch }}
          GATE_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: python3 tools/gate/check_gate.py format
      - name: Static analysis
        id: gate-static
        if: always()
        timeout-minutes: 3
        continue-on-error: true
        env:
          GATE_BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before || github.event.repository.default_branch }}
          GATE_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: python3 tools/gate/check_gate.py static
      - name: Sensitive information scan
        id: gate-secrets
        if: always()
        timeout-minutes: 3
        continue-on-error: true
        env:
          GATE_BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before || github.event.repository.default_branch }}
          GATE_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: python3 tools/gate/check_gate.py secrets
      - name: Production screenshot self-check
        id: gate-screenshot
        if: always() && steps.m73-build.outcome == 'success' && steps.playwright-install.outcome == 'success'
        working-directory: web
        timeout-minutes: 5
        continue-on-error: true
        run: |
          set -euo pipefail
          mkdir -p test-results
          command -v fuser >/dev/null 2>&1 || { echo "fuser is required to clean up a stale Playwright preview server"; exit 1; }
          fuser -k 4173/tcp || true
          npm run preview -- --host 127.0.0.1 --port 4173 > "$RUNNER_TEMP/agent-ops-gate/preview.log" 2>&1 &
          preview_pid=$!
          trap 'kill "$preview_pid" 2>/dev/null || true' EXIT
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:4173/ >/dev/null; then break; fi
            sleep 1
          done
          node --input-type=module <<'NODE'
          import { chromium } from '@playwright/test';
          const errors = [];
          const browser = await chromium.launch({ headless: true });
          try {
            const page = await browser.newPage({ viewport: { width: 1440, height: 1080 } });
            page.on('pageerror', error => errors.push(error.message));
            const response = await page.goto('http://127.0.0.1:4173/', { waitUntil: 'domcontentloaded', timeout: 20000 });
            if (!response || response.status() !== 200) throw new Error('production preview did not return HTTP 200');
            await page.waitForSelector('canvas', { timeout: 15000 });
            await page.screenshot({ path: 'test-results/agent-gate-homepage.png', fullPage: true });
            const layout = await page.evaluate(() => ({ width: document.documentElement.scrollWidth, viewport: window.innerWidth }));
            if (layout.width > layout.viewport) throw new Error('horizontal overflow detected');
            if (errors.length) throw new Error('pageerror: ' + errors.join('; '));
            console.log(JSON.stringify({ status: 'PASS', screenshot: 'test-results/agent-gate-homepage.png', canvas: true, layout }));
          } finally {
            await browser.close();
          }
          NODE
          python3 ../tools/gate/check_gate.py screenshot --path web/test-results/agent-gate-homepage.png
          sha256sum test-results/agent-gate-homepage.png | tee test-results/agent-gate-homepage.sha256
      - name: GitHub independent PR readback
        id: gate-readback
        if: always() && !cancelled() && github.event_name == 'pull_request'
        timeout-minutes: 3
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          EXPECTED_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          EXPECTED_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          EXPECTED_BASE_REF: ${{ github.event.pull_request.base.ref }}
          GATE_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          GATE_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: python3 tools/gate/check_gate.py readback --output "$RUNNER_TEMP/agent-ops-gate/readback.json"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        id: synthetic-artifact
        if: always()
        timeout-minutes: 5
        continue-on-error: true
        with:
          name: web-synthetic-validation
          path: |
            web/test-results/
            ${{ runner.temp }}/agent-ops-gate/
          retention-days: 7
          if-no-files-found: warn
      - name: Summarize machine gate and changed files
        id: gate-summary
        if: always()
        timeout-minutes: 3
        continue-on-error: true
        env:
          IS_PR: ${{ github.event_name == 'pull_request' && 'true' || 'false' }}
          PR_NUMBER: ${{ github.event.pull_request.number || 'unknown' }}
          GATE_BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before || github.event.repository.default_branch }}
          GATE_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          GATE_DEPS: ${{ steps.deps.outcome }}
          GATE_S41_E2E: ${{ steps.s41-e2e.outcome == 'skipped' && 'success' || steps.s41-e2e.outcome }}
          GATE_PARSER_UNIT: ${{ steps.parser-unit.outcome }}
          GATE_WEB_UNIT: ${{ steps.web-unit.outcome }}
          GATE_BUILD: ${{ steps.build.outcome }}
          GATE_M73_BUILD: ${{ steps.m73-build.outcome }}
          GATE_TYPECHECK: ${{ steps.typecheck.outcome }}
          GATE_FORMAT: ${{ steps.gate-format.outcome }}
          GATE_STATIC: ${{ steps.gate-static.outcome }}
          GATE_SECRETS: ${{ steps.gate-secrets.outcome }}
          GATE_SCREENSHOT: ${{ steps.gate-screenshot.outcome }}
          GATE_CHROMIUM_E2E: ${{ steps.chromium-e2e.outcome }}
          GATE_M73_E2E: ${{ steps.m73-e2e.outcome }}
          GATE_PLAYWRIGHT_INSTALL: ${{ steps.playwright-install.outcome }}
          GATE_STANDALONE_PREVIEW: ${{ steps.standalone-preview.outcome }}
          GATE_M73_FIXTURE: ${{ steps.m73-fixture.outcome }}
          GATE_SELF_TEST: ${{ steps.gate-self-test.outcome }}
          GATE_SYNTHETIC_ARTIFACT: ${{ steps.synthetic-artifact.outcome }}
        run: python3 tools/gate/check_gate.py summarize --output "$RUNNER_TEMP/agent-ops-gate/summary.md" --json-output "$RUNNER_TEMP/agent-ops-gate/summary.json" --readback "$RUNNER_TEMP/agent-ops-gate/readback.json"
      - name: Publish gate comment payload
        id: gate-summary-artifact
        if: always()
        timeout-minutes: 3
        continue-on-error: true
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: agent-ops-gate-summary
          path: |
            ${{ runner.temp }}/agent-ops-gate/summary.md
            ${{ runner.temp }}/agent-ops-gate/summary.json
          retention-days: 1
          if-no-files-found: warn
  gate-comment:
    needs: synthetic
    if: always() && github.event_name == 'pull_request'
    permissions:
      issues: write
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Download gate comment payload
        id: gate-comment-download
        if: always()
        timeout-minutes: 2
        continue-on-error: true
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: agent-ops-gate-summary
          path: ${{ runner.temp }}/agent-ops-gate-artifact
      - name: Prepare current-head gate comment
        id: gate-comment-prepare
        if: always()
        timeout-minutes: 2
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
          EXPECTED_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          EXPECTED_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          SYNTHETIC_RESULT: ${{ needs.synthetic.result }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          current_head="$(curl --fail --silent --show-error -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" "https://api.github.com/repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER" | jq -r '.head.sha')"
          if [ "$current_head" != "$EXPECTED_HEAD_SHA" ]; then
            echo "stale=true" >> "$GITHUB_OUTPUT"
            echo "Stale workflow run for head $EXPECTED_HEAD_SHA; current PR head is $current_head. Skip comment writeback."
            exit 0
          fi
          mkdir -p "$RUNNER_TEMP/agent-ops-gate-comment"
          summary_path="$(find "$RUNNER_TEMP/agent-ops-gate-artifact" -name summary.md -print -quit || true)"
          json_path="$(find "$RUNNER_TEMP/agent-ops-gate-artifact" -name summary.json -print -quit || true)"
          if [ -z "$summary_path" ] || [ -z "$json_path" ]; then
            summary_path="$RUNNER_TEMP/agent-ops-gate-comment/summary.md"
            json_path="$RUNNER_TEMP/agent-ops-gate-comment/summary.json"
            cat > "$summary_path" <<EOF
          <!-- agent-ops-gate -->
          ## 机器门禁结果：门禁未知

          - PR：#$PR_NUMBER
          - base：$EXPECTED_BASE_SHA
          - head：$EXPECTED_HEAD_SHA
          - synthetic job：$SYNTHETIC_RESULT
          - 原因：门禁 job 未能上传 summary artifact（可能发生 job 超时/取消或 artifact 上传失败）。

          缺少完整门禁证据，不得视为通过。
          EOF
            printf '{"overall":"UNKNOWN","reason":"summary artifact missing","synthetic_result":"%s"}\n' "$SYNTHETIC_RESULT" > "$json_path"
          fi
          echo "summary_path=$summary_path" >> "$GITHUB_OUTPUT"
          echo "summary_json=$json_path" >> "$GITHUB_OUTPUT"
      - name: Write machine gate result back to PR
        id: gate-comment-write
        if: steps.gate-comment-prepare.outcome == 'success' && steps.gate-comment-prepare.outputs.stale != 'true'
        timeout-minutes: 2
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          SUMMARY_PATH: ${{ steps.gate-comment-prepare.outputs.summary_path }}
        run: |
          set -euo pipefail
          body="$(cat "$SUMMARY_PATH")"
          existing_id="$(gh api --paginate "repos/$GITHUB_REPOSITORY/issues/$PR_NUMBER/comments?per_page=100" --jq '.[] | select(.user.login == "github-actions[bot]" and (.body | contains("<!-- agent-ops-gate -->"))) | .id' | head -n 1 || true)"
          payload="$(jq -n --arg body "$body" '{body: $body}')"
          if [ -n "$existing_id" ]; then
            printf '%s' "$payload" | gh api "repos/$GITHUB_REPOSITORY/issues/comments/$existing_id" --method PATCH --input -
            echo "Updated bot-owned gate comment $existing_id"
          else
            printf '%s' "$payload" | gh api "repos/$GITHUB_REPOSITORY/issues/$PR_NUMBER/comments" --method POST --input -
            echo "Created bot-owned gate comment"
          fi
      - name: Finalize machine gate status
        id: gate-finalize
        if: always()
        timeout-minutes: 1
        env:
          STALE: ${{ steps.gate-comment-prepare.outputs.stale }}
          PREPARE_OUTCOME: ${{ steps.gate-comment-prepare.outcome }}
          COMMENT_OUTCOME: ${{ steps.gate-comment-write.outcome }}
          SYNTHETIC_RESULT: ${{ needs.synthetic.result }}
          SUMMARY_JSON: ${{ steps.gate-comment-prepare.outputs.summary_json }}
        run: |
          set -euo pipefail
          if [ "$STALE" = "true" ]; then
            echo "Stale run; no PR comment or gate result is published."
            exit 0
          fi
          if [ "$PREPARE_OUTCOME" != "success" ] || [ "$COMMENT_OUTCOME" != "success" ] || [ ! -s "$SUMMARY_JSON" ]; then
            echo "::error::Gate comment/summary unavailable; result is UNKNOWN."
            exit 1
          fi
          overall="$(jq -r '.overall // "UNKNOWN"' "$SUMMARY_JSON")"
          if [ "$SYNTHETIC_RESULT" != "success" ] || [ "$overall" != "PASS" ]; then
            echo "::error::Machine gate not passed: synthetic=$SYNTHETIC_RESULT overall=$overall"
            exit 1
          fi
          echo "Final machine gate status: PASS"
  private-original:
    permissions:
      contents: read
      actions: read
    if: github.event_name == 'push' && contains(github.event.head_commit.message, '[private-smoke]')
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with: {persist-credentials: false}
      - name: Fetch hash-pinned sample or recover retained verified preview
        id: private_source
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          CLIENT_URL="https://oss.figupaw.com/client-updates/YBCS-Online-Setup-2.2.exe"
          INSTALLER_SHA="c42f37b06f27a6ee0b14e6fea6129cf89956a3e1c7a37c1172a28577f6cdae88"
          VERIFIED_HEAD="0a51f242a6357031f7f5b83c743fae7724c7e2f9"
          VERIFIED_RUN="35545442305"
          VERIFIED_ARTIFACT="10616895482"
          VERIFIED_HTML_SHA="f509c71b69ae5b41419a1f9c397108200bad1a1ef449f386927378d7d0ae59b4"

          if curl --fail --location --max-time 180 --retry 1 "$CLIENT_URL" -o "$RUNNER_TEMP/client.exe"; then
            echo "$INSTALLER_SHA  $RUNNER_TEMP/client.exe" | sha256sum -c -
            python3 tools/extract/extract_client.py "$RUNNER_TEMP/client.exe" --payload "$RUNNER_TEMP/payload.7z" --extract-dir "$RUNNER_TEMP/extracted" --expected-installer-sha256 "$INSTALLER_SHA"
            python3 tools/prepare_web.py --client-root "$RUNNER_TEMP/extracted/client" --out web/public/game-data
            echo "mode=installer" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::Pinned client URL is unavailable; using retained preview only after strict lineage and SHA verification."
            compare="$RUNNER_TEMP/private-lineage-compare.json"
            curl --fail --location --retry 2               -H "Authorization: Bearer $GH_TOKEN"               -H "Accept: application/vnd.github+json"               "https://api.github.com/repos/$GITHUB_REPOSITORY/compare/$VERIFIED_HEAD...${GITHUB_SHA}"               -o "$compare"
            python3 - "$compare" <<'PY'
          import json,sys
          payload=json.load(open(sys.argv[1],encoding='utf-8'))
          allowed={'.github/workflows/web-ci.yml','.github/workflows/s17-monster-visual-recovery.yml','web/soak.mjs','web/m6-validation-trigger.txt'}
          changed={row['filename'] for row in payload.get('files',[])}
          unexpected=sorted(changed-allowed)
          if unexpected:
              raise SystemExit(f'Fallback lineage rejected; runtime/content files changed: {unexpected}')
          print(json.dumps({'fallback_lineage_ok':True,'changed_files':sorted(changed)},ensure_ascii=False))
          PY
            curl --fail --location --retry 2               -H "Authorization: Bearer $GH_TOKEN"               -H "Accept: application/vnd.github+json"               "https://api.github.com/repos/$GITHUB_REPOSITORY/actions/artifacts/$VERIFIED_ARTIFACT/zip"               -o "$RUNNER_TEMP/verified-private.zip"
            mkdir -p "$RUNNER_TEMP/verified-private"
            unzip -q "$RUNNER_TEMP/verified-private.zip" -d "$RUNNER_TEMP/verified-private"
            preview="$(find "$RUNNER_TEMP/verified-private" -type f -name lapis-private.html -print -quit)"
            test -n "$preview"
            cp "$preview" "$RUNNER_TEMP/lapis-private.html"
            echo "$VERIFIED_HTML_SHA  $RUNNER_TEMP/lapis-private.html" | sha256sum -c -
            mkdir -p web/test-results
            python3 - "$compare" web/test-results/private-fallback-lineage.json "$VERIFIED_HEAD" "$VERIFIED_RUN" "$VERIFIED_ARTIFACT" "$VERIFIED_HTML_SHA" "${GITHUB_SHA}" <<'PY'
          import json,sys
          compare_path,out,verified_head,verified_run,artifact_id,html_sha,current_head=sys.argv[1:]
          compare=json.load(open(compare_path,encoding='utf-8'))
          record={
            'status':'verified-retained-preview',
            'reason':'Pinned public installer URL returned HTTP failure.',
            'verified_head':verified_head,
            'verified_run_id':int(verified_run),
            'verified_artifact_id':int(artifact_id),
            'verified_html_sha256':html_sha,
            'current_head':current_head,
            'allowed_delta':['.github/workflows/web-ci.yml','.github/workflows/s17-monster-visual-recovery.yml','web/soak.mjs','web/m6-validation-trigger.txt'],
            'actual_delta':sorted(row['filename'] for row in compare.get('files',[])),
            'evidence_boundary':'The retained preview is reused only because no runtime/content source changed since the fixed-hash private-original run. The current soak script is executed against that exact verified HTML.',
          }
          json.dump(record,open(out,'w',encoding='utf-8'),ensure_ascii=False,indent=2)
          PY
            echo "mode=retained-preview" >> "$GITHUB_OUTPUT"
          fi
      - name: Capture MagicRes, map, combat, binary and content structural evidence
        if: steps.private_source.outputs.mode == 'installer'
        run: |
          python3 tools/inspect_magicres.py --client-root "$RUNNER_TEMP/extracted/client" --out web/test-results/magicres-summary.json
          python3 tools/probe_maps.py --client-root "$RUNNER_TEMP/extracted/client" --start 0 --count 12 --out web/test-results/map-probe.json
          python3 tools/probe_npc_quest.py --client-root "$RUNNER_TEMP/extracted/client" --out web/test-results/npc-quest-probe.json
          python3 tools/probe_combat_resources.py --client-root "$RUNNER_TEMP/extracted/client" --out web/test-results/combat-resource-summary.json --preview-dir web/test-results/combat-previews
          python3 tools/probe_battle_binary.py "$RUNNER_TEMP/extracted/client/NeoDark.exe" --out web/test-results/battle-binary-xrefs.json
          python3 tools/inspect_quest_resources.py --client-root "$RUNNER_TEMP/extracted/client" --out web/test-results/quest-resource-structure.json
          python3 tools/validate/validate_quest_content.py "$RUNNER_TEMP/extracted/client/NRes/Quest.lib" --out web/test-results/quest-content-summary.json
          python3 tools/validate/validate_extended_content.py "$RUNNER_TEMP/extracted/client/NRes/Quest.lib" --out web/test-results/extended-content-summary.json
          python3 tools/validate/validate_tip_assets.py --client-root "$RUNNER_TEMP/extracted/client" --out web/test-results/tip-structure-summary.json
      - name: Publish static evidence early
        if: steps.private_source.outputs.mode == 'installer'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: private-static-evidence
          path: |
            web/test-results/magicres-summary.json
            web/test-results/map-probe.json
            web/test-results/npc-quest-probe.json
            web/test-results/combat-resource-summary.json
            web/test-results/combat-previews/
            web/test-results/battle-binary-xrefs.json
            web/test-results/quest-resource-structure.json
            web/test-results/quest-content-summary.json
            web/test-results/extended-content-summary.json
            web/test-results/tip-structure-summary.json
          retention-days: 3
          if-no-files-found: error
      - name: Publish private combat sources
        if: steps.private_source.outputs.mode == 'installer'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: private-combat-source
          path: |
            ${{ runner.temp }}/extracted/client/NRes/CombatMap.Tip
            ${{ runner.temp }}/extracted/client/Dlg/CombatSelect.Tdg
          retention-days: 1
          if-no-files-found: error
      - name: Extract Quest source for private analysis
        if: steps.private_source.outputs.mode == 'installer'
        run: python3 tools/extract/lib_archive.py "$RUNNER_TEMP/extracted/client/NRes/Quest.lib" --extract-dir "$RUNNER_TEMP/quest-source"
      - name: Publish private Quest source
        if: steps.private_source.outputs.mode == 'installer'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: private-quest-source
          path: ${{ runner.temp }}/quest-source/
          retention-days: 1
          if-no-files-found: error
      - name: Publish private NPC350 source
        if: steps.private_source.outputs.mode == 'installer'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: private-npc350-source
          path: ${{ runner.temp }}/extracted/client/NRes/NPC350.Tip
          retention-days: 1
          if-no-files-found: error
      - name: Build and browser setup
        working-directory: web
        run: |
          npm ci --ignore-scripts
          if [ "${{ steps.private_source.outputs.mode }}" = "installer" ]; then npm run build; fi
          npx playwright install --with-deps chromium
      - name: Private standalone preview
        if: steps.private_source.outputs.mode == 'installer'
        run: python3 tools/package_web_preview.py --dist web/dist --pack web/public/game-data --out "$RUNNER_TEMP/lapis-private.html"
      - name: Real-resource browser and offline tests
        if: steps.private_source.outputs.mode == 'installer'
        working-directory: web
        env:
          LAPIS_OFFLINE_PREVIEW: ${{ runner.temp }}/lapis-private.html
          S41_M7_1_FINAL: '1'
        # One CI retry absorbs transient Chromium screenshot/protocol failures;
        # deterministic assertion failures still fail both attempts.
        run: npm run test:e2e -- --retries=1
      - name: Record inherited private-browser acceptance
        if: steps.private_source.outputs.mode == 'retained-preview'
        run: |
          echo "Fixed-hash private browser acceptance is inherited from run 35545442305 / head 0a51f242a6357031f7f5b83c743fae7724c7e2f9."
          echo "Current lineage guard permits only web/soak.mjs and this workflow to differ."
      - name: Real thirty-minute diagnostic soak
        if: contains(github.event.head_commit.message, '[private-soak]')
        working-directory: web
        env:
          LAPIS_OFFLINE_PREVIEW: ${{ runner.temp }}/lapis-private.html
        run: node soak.mjs
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: private-original-validation
          path: |
            web/test-results/
            ${{ runner.temp }}/lapis-private.html
          retention-days: 3
          if-no-files-found: warn
