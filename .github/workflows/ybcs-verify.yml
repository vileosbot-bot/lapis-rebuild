            Write-Host "NPC_GREETING_DIAGNOSTIC_EVENT_COUNT=$($greetingDiagnosticEvents.Count)"
            foreach ($eventLine in ($greetingDiagnosticEvents | Select-Object -Last 8)) {
              Write-Host "NPC_GREETING_DIAGNOSTIC_EVENT: $eventLine"
            }
            Write-Host "NPC_HOVER_ONLY_BEGIN screen=($screenX,$screenY) client=($clientX,$clientY) button_down_up_events_sent=0"
            if (-not [WinInput]::SetCursorPos($screenX, $screenY)) {
              throw "Could not move cursor to the measured second-option text center"
            }
            Start-Sleep -Milliseconds 900
            Shot "npc-menu-second-option-hover"
            Start-Sleep -Seconds 2
            $hitTestEvents = @()
            if (Test-Path -LiteralPath $clientLog) {
              $allClientRows = @(Get-Content -LiteralPath $clientLog -ErrorAction SilentlyContinue)
              if ($allClientRows.Count -gt $clientBeforeHover) {
                $hitTestEvents = @($allClientRows | Select-Object -Skip $clientBeforeHover | Where-Object {
                  $_ -match 'npc_menu_hit_test_(enter|return)' -or
                  $_ -match 'npc_menu_click_handler_(enter|return)' -or
                  $_ -match 'npc_dialog_native_call_enter.*npc_menu_hit_test_0x004572A0'
                })
              }
            }
            Write-Host "NPC_HOVER_HIT_TEST_EVENT_COUNT=$($hitTestEvents.Count)"
            foreach ($eventLine in ($hitTestEvents | Select-Object -Last 12)) {
              Write-Host "NPC_HOVER_HIT_TEST_EVENT: $eventLine"
            }
            $screenBounds = [System.Windows.Forms.Screen]::PrimaryScreen.Bounds
            [WinInput]::SetCursorPos($screenBounds.Right - 20, $screenBounds.Bottom - 40) | Out-Null
            Start-Sleep -Milliseconds 250
            $processExited = $false
            $exitCode = "not-exited"
            try {
              $game.Refresh()
              $processExited = [bool]$game.HasExited
              if ($processExited) { $exitCode = [int]$game.ExitCode }
            } catch {
              $exitCode = "query-error: $($_.Exception.Message)"
            }
            $processAlive = -not $processExited
            $windowVisible = $false
            try { $windowVisible = [WinInput]::IsWindowVisible($gameHwnd) } catch {}
            $clientSizeAfter = @(0, 0)
            try { $clientSizeAfter = [WinInput]::GetClientSize($gameHwnd) } catch {}
            $heartbeatAfterHover = Get-ClientHeartbeatCount $clientLog
            $serverDisconnectLine = Get-ServerDisconnectLine $serverLog $serverBeforeHover
            Write-Host "NPC_DIAGNOSTIC_SURVIVAL process_alive=$processAlive window_visible=$windowVisible client_size=$($clientSizeAfter -join 'x') heartbeat_before=$heartbeatBeforeHover heartbeat_after=$heartbeatAfterHover heartbeat_advanced=$($heartbeatAfterHover -gt $heartbeatBeforeHover) server_disconnected=$($null -ne $serverDisconnectLine) process_exit_code=$exitCode"
            if ($processExited -or -not $windowVisible -or $serverDisconnectLine) {
              Write-Host "NPC_DIAGNOSTIC_LAST_CLIENT_LOG_LINE: $(Get-LastLogLine $clientLog)"
              Write-Host "NPC_DIAGNOSTIC_LAST_SERVER_LOG_LINE: $(Get-LastLogLine $serverLog)"
              if ($serverDisconnectLine) { Write-Host "NPC_DIAGNOSTIC_SERVER_DISCONNECT_EVENT: $serverDisconnectLine" }
              try {
                $appErrors = @(Get-WinEvent -FilterHashtable @{ LogName = "Application"; Id = 1000,1001; StartTime = (Get-Date).AddMinutes(-30) } -MaxEvents 30 -ErrorAction Stop |
                  Where-Object { $_.Message -match 'NeoDark\.exe' })
                foreach ($appError in $appErrors) {
                  Write-Host "WINDOWS_APPLICATION_ERROR_EVENT id=$($appError.Id) time=$($appError.TimeCreated.ToString('o')) message=$($appError.Message)"
                }
                if ($appErrors.Count -eq 0) { Write-Host "WINDOWS_APPLICATION_ERROR_EVENT: none for NeoDark.exe in the last 30 minutes" }
              } catch {
                Write-Host "WINDOWS_APPLICATION_ERROR_QUERY_UNAVAILABLE: $($_.Exception.Message)"
              }
            }
            Shot "npc-menu-diagnostic-after-hover"
            Write-Host "DIAGNOSTIC_ONLY_COMPLETE: no menu option was clicked; no purchase click, 0x30 request, shop open, or purchase was attempted"
            return
            Write-Host "consumables shop opened: $shopOpened"
            Start-Sleep -Seconds 2
            Shot "shop-open"
            Shot "shop-before-purchase"

            $redBefore = Get-LogLineCount $serverLog
            Focus-Game
            [WinInput]::PressKey(0x24)
            [WinInput]::PressKey(0x0D)
            Start-Sleep -Seconds 2
            Shot "shop-red-quantity-dialog"
            Focus-Game
            [System.Windows.Forms.SendKeys]::SendWait("^a")
            [System.Windows.Forms.SendKeys]::SendWait("30")
            [System.Windows.Forms.SendKeys]::SendWait("{ENTER}")
            $redPurchase = Wait-ShopPurchase 4001 $redBefore
            if (-not $redPurchase) { throw "Recovery potion 4001 purchase of quantity 30 was not confirmed by server log" }
            Write-Host "RED POTION PURCHASE CONFIRMED: $redPurchase"
            Start-Sleep -Seconds 2
            Shot "shop-red-purchased"

            $blueBefore = Get-LogLineCount $serverLog
            Focus-Game
            [WinInput]::PressKey(0x24)
            for ($k = 0; $k -lt 4; $k++) { [WinInput]::PressKey(0x28) }
            [WinInput]::PressKey(0x0D)
            Start-Sleep -Seconds 2
            Shot "shop-blue-quantity-dialog"
            Focus-Game
            [System.Windows.Forms.SendKeys]::SendWait("^a")
            [System.Windows.Forms.SendKeys]::SendWait("30")
            [System.Windows.Forms.SendKeys]::SendWait("{ENTER}")
            $bluePurchase = Wait-ShopPurchase 4006 $blueBefore
            if (-not $bluePurchase) { throw "Magic potion 4006 purchase of quantity 30 was not confirmed by server log" }
            Write-Host "BLUE POTION PURCHASE CONFIRMED: $bluePurchase"
            Start-Sleep -Seconds 2
            Shot "shop-blue-purchased"

            Focus-Game
            [WinInput]::PressKey(0x1B)
            Start-Sleep -Seconds 1
            Click-Client 350 12
            Start-Sleep -Seconds 3
            Shot "inventory-after-potions"
            Focus-Game
            [WinInput]::PressKey(0x1B)
            Write-Host "POTION PURCHASE AUTOMATION COMPLETE: item 4001 x30 and item 4006 x30"
          }
          catch {
            $failureReason = $_.Exception.Message
            Write-Host "POTION ROUTE/AUTOMATION STOPPED: $failureReason"
            Shot "automation-stopped"
          }

          for ($i = 1; $i -le 16; $i++) {
            Start-Sleep -Seconds 30
            $n = "{0:D2}" -f $i
            Shot "shot-$n"
            $nd = Get-Process -Name NeoDark -ErrorAction SilentlyContinue
            if (-not $nd -and $i -ge 4) { Write-Host "NeoDark not running at shot $n; stopping loop"; break }
          }
          try { Stop-Process -Id $p.Id -Force -ErrorAction SilentlyContinue } catch {}
          try { Get-Process -Name NeoDark -ErrorAction SilentlyContinue | Stop-Process -Force -ErrorAction SilentlyContinue } catch {}
          try { Get-Process -Name python -ErrorAction SilentlyContinue | Where-Object { $_.Path -like "*runtime*" } | Stop-Process -Force -ErrorAction SilentlyContinue } catch {}
          Write-Host "--- NeoDark processes after stop ---"
          Get-Process -Name NeoDark -ErrorAction SilentlyContinue | Select-Object Id, ProcessName | Format-Table -AutoSize
          Write-Host "--- game stdout tail ---"
          Get-Content (Join-Path $ws "game-stdout.log") -Tail 30 -ErrorAction SilentlyContinue
          Write-Host "--- game stderr tail ---"
          Get-Content (Join-Path $ws "game-stderr.log") -Tail 30 -ErrorAction SilentlyContinue
          if ($failureReason) { throw $failureReason }

      - name: Collect logs
        shell: pwsh
        if: always()
        run: |
          New-Item -ItemType Directory -Force -Path collected | Out-Null
          Copy-Item precheck.log collected/ -ErrorAction SilentlyContinue
          Copy-Item game-stdout.log collected/ -ErrorAction SilentlyContinue
          Copy-Item game-stderr.log collected/ -ErrorAction SilentlyContinue
          Copy-Item npc-window-tree.txt collected/ -ErrorAction SilentlyContinue
          Copy-Item ybcs\runtime\logs\* collected/ -Recurse -ErrorAction SilentlyContinue
          Get-ChildItem collected -Recurse | Select-Object FullName, Length | Format-Table -AutoSize

      - name: Upload artifacts (screenshots + logs)
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ybcs-verify
          path: |
            screenshots/
            collected/
          retention-days: 30
