name: ybcs-offline-verify

on:
  push:
    branches: [ybcs-verify]
    paths: ['.github/workflows/ybcs-verify.yml']
  workflow_dispatch:

jobs:
  verify:
    runs-on: windows-latest
    timeout-minutes: 120
    steps:
      - name: Download ybcs-offline.zip (public Drive link)
        shell: pwsh
        run: |
          pip install gdown
          gdown "https://drive.google.com/uc?export=download&id=1qNOt9-aMiN8dZsh2FOlT5rhltZCyeFvt" -O ybcs-offline.zip
          $h = (Get-FileHash ybcs-offline.zip -Algorithm SHA256).Hash.ToLower()
          Write-Host "SHA256: $h"
          if ($h -ne "d79c012177c8b1701188a90825539466d28cc18dc87b3c62361b4960b315724d") { throw "SHA-256 mismatch" }
          Write-Host "SHA OK, size:" (Get-Item ybcs-offline.zip).Length

      - name: Extract package
        shell: pwsh
        run: |
          Expand-Archive ybcs-offline.zip -DestinationPath ybcs
          Write-Host "--- top level ---"
          Get-ChildItem ybcs | Select-Object Name, Length | Format-Table -AutoSize
          Write-Host "--- launcher cmd files ---"
          Get-ChildItem ybcs -Filter "*.cmd" -Recurse | Select-Object FullName | Format-Table -AutoSize

      - name: Pre-check (no GUI, exit code recorded)
        shell: pwsh
        run: |
          cd ybcs
          $launcher = Get-ChildItem -Filter "*单机游戏.cmd" | Select-Object -First 1
          if (-not $launcher) { $launcher = Get-ChildItem -Filter "*.cmd" | Select-Object -First 1 }
          Write-Host "launcher: $($launcher.Name)"
          cmd /c "`"$($launcher.Name)`" --check --no-pause" 2>&1 | Tee-Object -FilePath ..\precheck.log
          Write-Host "precheck exit code: $LASTEXITCODE"
          if ($LASTEXITCODE -ne 0) { Write-Host "PRECHECK FAILED (exit $LASTEXITCODE) - see precheck.log" }

      - name: Launch game and screenshot
        shell: pwsh
        run: |
          $ws = $env:GITHUB_WORKSPACE
          $shotDir = Join-Path $ws "screenshots"
          New-Item -ItemType Directory -Force -Path $shotDir | Out-Null
          $clientLog = Join-Path $ws "ybcs\runtime\logs\ybcs-gui-client.jsonl"
          $serverLog = Join-Path $ws "ybcs\runtime\logs\ybcs-gui-server.log"
          cd ybcs
          $npcPatch = @'
          from pathlib import Path

          path = Path("src/legacy_gui_runtime/ybcs_emulated_launcher.py")
          original = path.read_bytes()

          old_enter = b'''      onEnter(args) {
                  this.offlineNpcClick = null;
                  const scene = this.context.ecx;
                  const relativePoint = args[0];
                  const target = offlineNpcWorldEntityAt(scene, relativePoint);
                  if (target === null) return;
                  const mapWire = safeS16(ptr(0x004F48B4));
                  const entityId = safeU16(target.add(0xB4));
                  const row = offlineNpcSingleClickRow(mapWire, entityId);
                  if (row === null) return;
                  this.offlineNpcClick = {
                    target: target,
                    row: row,
                    mapWire: mapWire
                  };
                },
          '''
          new_enter = b'''      onEnter(args) {
                  this.offlineNpcClick = null;
                  const scene = this.context.ecx;
                  const relativePoint = args[0];
                  const relativeX = safeDword(relativePoint, true);
                  const relativeY = safeDword(relativePoint.add(4), true);
                  const sceneOffsetX = safeDword(scene.add(0x25C4), true);
                  const sceneOffsetY = safeDword(scene.add(0x25C8), true);
                  let clickedCell = null;
                  if (relativeX !== null && relativeY !== null &&
                      sceneOffsetX !== null && sceneOffsetY !== null) {
                    clickedCell = offlineNpcScreenToCell(
                      relativeX + sceneOffsetX, relativeY + sceneOffsetY
                    );
                  }
                  const target = offlineNpcWorldEntityAt(scene, relativePoint);
                  const mapWire = safeS16(ptr(0x004F48B4));
                  const entityId = target === null ? null : safeU16(target.add(0xB4));
                  const row = target === null
                    ? null
                    : offlineNpcSingleClickRow(mapWire, entityId);
                  emit("offline_npc_single_click_probe", {
                    mapWire: mapWire,
                    relativeX: relativeX,
                    relativeY: relativeY,
                    sceneOffsetX: sceneOffsetX,
                    sceneOffsetY: sceneOffsetY,
                    clickedCell: clickedCell,
                    targetFound: target !== null,
                    targetEntityId: entityId,
                    targetCell: target === null ? null : [
                      safeDword(target.add(0xD4), true),
                      safeDword(target.add(0xD8), true)
                    ],
                    rowFound: row !== null
                  });
                  if (target === null || row === null) return;
                  this.offlineNpcClick = {
                    target: target,
                    row: row,
                    mapWire: mapWire
                  };
                },
          '''

          old_leave = b'''      onLeave() {
                  if (this.offlineNpcClick === null) return;
                  const click = this.offlineNpcClick;
                  const selected = selectedWorldEntity();
                  if (selected === null || !selected.equals(click.target)) return;
                  const self = offlineNpcCurrentSelf();
                  if (self === null || self.equals(selected)) return;
                  const distance = offlineNpcInteractionDistance(self, selected);
                  const accepted = distance !== null &&
                    distance < OFFLINE_NPC_SINGLE_CLICK_DISTANCE;
          '''
          new_leave = b'''      onLeave() {
                  if (this.offlineNpcClick === null) return;
                  const click = this.offlineNpcClick;
                  const nativeSelected = selectedWorldEntity();
                  const nativeSelectionMatches = nativeSelected !== null &&
                    nativeSelected.equals(click.target);
                  const self = offlineNpcCurrentSelf();
                  const distance = self === null || self.equals(click.target)
                    ? null
                    : offlineNpcInteractionDistance(self, click.target);
                  emit("offline_npc_single_click_candidate", {
                    mapWire: click.mapWire,
                    entityId: click.row.entityId,
                    role: click.row.role,
                    nativeSelectedEntityId: nativeSelected === null
                      ? null
                      : safeS16(nativeSelected.add(0xB4)),
                    nativeSelectionMatches: nativeSelectionMatches,
                    sceneSelectedId: safeDword(ptr(0x00A399D8).add(0x800), true),
                    playerCell: self === null ? null : [
                      safeDword(self.add(0xD4), true),
                      safeDword(self.add(0xD8), true)
                    ],
                    targetCell: [
                      safeDword(click.target.add(0xD4), true),
                      safeDword(click.target.add(0xD8), true)
                    ],
                    distance: distance,
                    exclusiveDistanceLimit: OFFLINE_NPC_SINGLE_CLICK_DISTANCE
                  });
                  if (distance === null) return;
                  const accepted = distance < OFFLINE_NPC_SINGLE_CLICK_DISTANCE;
          '''

          if original.count(old_enter) != 1:
              raise SystemExit(f"NPC onEnter anchor count must be 1, got {original.count(old_enter)}")
          if original.count(old_leave) != 1:
              raise SystemExit(f"NPC onLeave anchor count must be 1, got {original.count(old_leave)}")

          patched = original.replace(old_enter, new_enter, 1).replace(old_leave, new_leave, 1)
          compile(patched.decode("utf-8"), str(path), "exec")
          if b"if (selected === null || !selected.equals(click.target)) return;" in patched:
              raise SystemExit("stale selected-world-entity gate remains")
          if b"offlineNpcInteractionDistance(self, click.target)" not in patched:
              raise SystemExit("distance check is not bound to exact clicked NPC")
          if b"queueOfflineNpcSingleClick(" not in patched:
              raise SystemExit("original exact 0x08 sender is missing")
          old_trace_anchor = b'''const offlineNpcSingleClickInstallTimer = setTimeout(
            installOfflineNpcSingleClickInteraction,
            OFFLINE_NPC_SINGLE_CLICK_INSTALL_DELAY_MS
          );
          '''
          new_trace_anchor = b'''let npcDialogNativeTraceInstalled = false;
          let npcDialogNativeTraceSequence = 0;
          function npcDialogTraceHex(bytes) {
            return Array.from(bytes).map(function(value) {
              return (value < 16 ? "0" : "") + value.toString(16);
            }).join("");
          }
          function npcDialogTraceReadS16(bytes, offset) {
            const value = bytes[offset] | (bytes[offset + 1] << 8);
            return (value & 0x8000) !== 0 ? value - 0x10000 : value;
          }
          function npcDialogTraceReadU32(bytes, offset) {
            return (bytes[offset] | (bytes[offset + 1] << 8) |
              (bytes[offset + 2] << 16) | (bytes[offset + 3] << 24)) >>> 0;
          }
          function npcDialogTraceReadS32(bytes, offset) {
            const value = npcDialogTraceReadU32(bytes, offset);
            return value > 0x7fffffff ? value - 0x100000000 : value;
          }
          function npcDialogTraceFindMenuRows(bytes) {
            const fullExpected = [
              {kind: 1, x: 150, y: 17, width: 200, height: 12, ordinal: null},
              {kind: 2, x: 150, y: 17, width: 200, height: 12, ordinal: 0},
              {kind: 2, x: 150, y: 35, width: 200, height: 12, ordinal: 1},
              {kind: 2, x: 150, y: 53, width: 200, height: 12, ordinal: 2}
            ];
            const selectableExpected = [
              {kind: 2, x: 150, y: 17, width: 200, height: 12, ordinal: 0},
              {kind: 2, x: 150, y: 35, width: 200, height: 12, ordinal: 1},
              {kind: 2, x: 150, y: 53, width: 200, height: 12, ordinal: 2}
            ];
            const layouts = [
              {name: "kind-u8-i16x4", stride: 9, kindOffset: 0, kindWidth: 1, coordOffset: 1, coordWidth: 2},
              {name: "kind-u16-i16x4", stride: 10, kindOffset: 0, kindWidth: 2, coordOffset: 2, coordWidth: 2},
              {name: "kind-u8-pad1-i16x4", stride: 10, kindOffset: 0, kindWidth: 1, coordOffset: 2, coordWidth: 2},
              {name: "kind-u32-i16x4", stride: 12, kindOffset: 0, kindWidth: 4, coordOffset: 4, coordWidth: 2},
              {name: "kind-u8-pad3-i16x4", stride: 12, kindOffset: 0, kindWidth: 1, coordOffset: 4, coordWidth: 2},
              {name: "kind-u32-i32x4", stride: 20, kindOffset: 0, kindWidth: 4, coordOffset: 4, coordWidth: 4},
              {name: "kind-u8-pad3-i32x4", stride: 20, kindOffset: 0, kindWidth: 1, coordOffset: 4, coordWidth: 4}
            ];
            function readField(offset, width, signed) {
              if (offset < 0 || offset + width > bytes.length) return null;
              if (width === 1) return bytes[offset];
              if (width === 2) return signed
                ? npcDialogTraceReadS16(bytes, offset)
                : (bytes[offset] | (bytes[offset + 1] << 8));
              return signed
                ? npcDialogTraceReadS32(bytes, offset)
                : npcDialogTraceReadU32(bytes, offset);
            }
            function rowAt(layout, offset) {
              const kind = readField(offset + layout.kindOffset, layout.kindWidth, false);
              const coord = offset + layout.coordOffset;
              if (kind !== 1 && kind !== 2) return null;
              return {
                kind: kind,
                x: readField(coord, layout.coordWidth, true),
                y: readField(coord + layout.coordWidth, layout.coordWidth, true),
                width: readField(coord + layout.coordWidth * 2, layout.coordWidth, true),
                height: readField(coord + layout.coordWidth * 3, layout.coordWidth, true)
              };
            }
            function matches(actual, expected) {
              return actual !== null && actual.kind === expected.kind &&
                actual.x === expected.x && actual.y === expected.y &&
                actual.width === expected.width && actual.height === expected.height;
            }
            const arrays = [];
            const rows = [];
            layouts.forEach(function(layout) {
              for (let offset = 0; offset + layout.stride * 4 <= bytes.length; offset++) {
                const entries = [];
                let valid = true;
                for (let index = 0; index < fullExpected.length; index++) {
                  const actual = rowAt(layout, offset + index * layout.stride);
                  if (!matches(actual, fullExpected[index])) {
                    valid = false;
                    break;
                  }
                  entries.push({
                    rowIndex: index,
                    kind: actual.kind,
                    x: actual.x,
                    y: actual.y,
                    width: actual.width,
                    height: actual.height,
                    ordinal: fullExpected[index].ordinal
                  });
                }
                if (valid) arrays.push({layout: layout.name, offset: offset, entryCount: 4, entries: entries});
              }
              for (let offset = 0; offset + layout.stride * 3 <= bytes.length; offset++) {
                const entries = [];
                let valid = true;
                for (let index = 0; index < selectableExpected.length; index++) {
                  const actual = rowAt(layout, offset + index * layout.stride);
                  if (!matches(actual, selectableExpected[index])) {
                    valid = false;
                    break;
                  }
                  entries.push({
                    rowIndex: index,
                    kind: actual.kind,
                    x: actual.x,
                    y: actual.y,
                    width: actual.width,
                    height: actual.height,
                    ordinal: selectableExpected[index].ordinal
                  });
                }
                if (valid) arrays.push({layout: layout.name, offset: offset, entryCount: 3, entries: entries});
              }
              for (let offset = 0; offset + layout.stride <= bytes.length; offset++) {
                const actual = rowAt(layout, offset);
                if (actual !== null && actual.x === 150 &&
                    (actual.y === 17 || actual.y === 35 || actual.y === 53) &&
                    actual.width === 200 && actual.height === 12) {
                  rows.push({
                    layout: layout.name,
                    offset: offset,
                    kind: actual.kind,
                    x: actual.x,
                    y: actual.y,
                    width: actual.width,
                    height: actual.height
                  });
                }
              }
            });
            return {arrays: arrays.slice(0, 8), rows: rows.slice(0, 32)};
          }
          function npcDialogTraceFindProgram15(bytes) {
            const candidates = [];
            for (let offset = 0; offset < bytes.length && candidates.length < 24; offset++) {
              if (bytes[offset] === 15) candidates.push({width: 1, offset: offset, value: 15});
              if (offset + 2 <= bytes.length &&
                  (bytes[offset] | (bytes[offset + 1] << 8)) === 15) {
                candidates.push({width: 2, offset: offset, value: 15});
              }
              if (offset + 4 <= bytes.length && npcDialogTraceReadU32(bytes, offset) === 15) {
                candidates.push({width: 4, offset: offset, value: 15});
              }
            }
            return candidates;
          }
          function npcDialogTracePointer(value, maxBytes) {
            let addressText = null;
            try {
              const address = ptr(value);
              addressText = address.toString();
              const numericAddress = address.toUInt32();
              if (address.isNull() || numericAddress < 0x10000) {
                return {status: "not-pointer", address: addressText};
              }
              let range = null;
              let rangeLookupError = null;
              try {
                range = Process.findRangeByAddress(address);
              } catch (rangeError) {
                rangeLookupError = String(rangeError);
              }
              let protection = null;
              let available = null;
              if (range !== null) {
                protection = range.protection;
                if (protection.indexOf("r") < 0) {
                  return {
                    status: "not-readable",
                    address: addressText,
                    rangeBase: range.base.toString(),
                    rangeSize: range.size,
                    protection: protection
                  };
                }
                try {
                  available = range.base.add(range.size).sub(address).toUInt32();
                } catch (sizeError) {
                  rangeLookupError = String(sizeError);
                }
              }
              const requested = maxBytes || 128;
              const length = Math.min(requested, available === null ? Math.min(requested, 64) : available);
              if (length < 8) {
                return {
                  status: "range-too-short",
                  address: addressText,
                  rangeBase: range === null ? null : range.base.toString(),
                  rangeSize: range === null ? null : range.size,
                  protection: protection,
                  available: available
                };
              }
              const raw = Memory.readByteArray(address, length);
              if (raw === null) return {status: "empty-read", address: addressText, requestedBytes: length};
              const bytes = Array.from(new Uint8Array(raw));
              const dwordCandidates = [];
              const pointerWords = [];
              for (let offset = 0; offset + 4 <= bytes.length; offset += 4) {
                const pointerValue = npcDialogTraceReadU32(bytes, offset);
                if (pointerValue < 0x10000) continue;
                let targetRange = null;
                try {
                  targetRange = Process.findRangeByAddress(ptr(pointerValue));
                } catch (_) {}
                const targetProtection = targetRange === null ? null : targetRange.protection;
                const readableTarget = targetRange !== null &&
                  targetProtection.indexOf("r") >= 0 && targetProtection.indexOf("x") < 0;
                const candidate = {
                  offset: offset,
                  value: pointerValue,
                  hex: "0x" + pointerValue.toString(16),
                  targetProtection: targetProtection,
                  readableTarget: readableTarget
                };
                dwordCandidates.push(candidate);
                if (readableTarget) pointerWords.push(candidate);
              }
              const rowAnalysis = npcDialogTraceFindMenuRows(bytes);
              return {
                status: "readable",
                address: addressText,
                rangeBase: range === null ? null : range.base.toString(),
                rangeSize: range === null ? null : range.size,
                protection: protection,
                rangeLookupError: rangeLookupError,
                byteLength: bytes.length,
                bytesHex: npcDialogTraceHex(bytes),
                program15Candidates: npcDialogTraceFindProgram15(bytes),
                menuRowArrayCandidates: rowAnalysis.arrays,
                menuRowCandidates: rowAnalysis.rows,
                dwordCandidates: dwordCandidates.slice(0, 32),
                pointerWords: pointerWords.slice(0, 24)
              };
            } catch (error) {
              return {status: "read-error", address: addressText, error: String(error)};
            }
          }
          function npcDialogTraceSnapshot(name, address, args, context) {
            const registers = {};
            const candidateWords = [];
            const argumentWords = [];
            const stackWords = [];
            const frameWords = [];
            const memorySnapshots = [];
            const nestedPointerSnapshots = [];
            const memoryReadErrors = [];
            const seenMemory = {};
            function addMemorySnapshot(source, value, maxBytes) {
              try {
                const address = ptr(value);
                const addressText = address.toString();
                if (address.isNull() || address.toUInt32() < 0x10000) return null;
                if (seenMemory[addressText] !== undefined) {
                  seenMemory[addressText].sources.push(source);
                  return seenMemory[addressText];
                }
                const entry = {
                  sources: [source],
                  snapshot: npcDialogTracePointer(address, maxBytes)
                };
                seenMemory[addressText] = entry;
                memorySnapshots.push(entry);
                return entry;
              } catch (error) {
                memoryReadErrors.push({source: source, error: String(error)});
                return null;
              }
            }
            ["eax", "ebx", "ecx", "edx", "esi", "edi", "ebp", "esp", "eip"].forEach(function(registerName) {
              try {
                const value = context[registerName].toUInt32();
                registers[registerName] = "0x" + value.toString(16);
                if (value <= 0xffff) candidateWords.push({source: "reg." + registerName, value: value});
                if (registerName === "ecx" || registerName === "ebp" ||
                    registerName === "edi" || registerName === "esi" || registerName === "esp") {
                  addMemorySnapshot("reg." + registerName, value, 128);
                }
              } catch (_) {}
            });
            for (let index = 0; index < 8; index++) {
              try {
                const value = args[index].toUInt32();
                argumentWords.push({index: index, value: value, hex: "0x" + value.toString(16)});
                if (value <= 0xffff) candidateWords.push({source: "arg" + index, value: value});
                else addMemorySnapshot("arg" + index, value, 128);
              } catch (_) {}
            }
            try {
              const esp = context.esp;
              for (let index = 0; index < 16; index++) {
                try {
                  const value = esp.add(index * 4).readU32();
                  stackWords.push({index: index, value: value, hex: "0x" + value.toString(16)});
                  if (value <= 0xffff) candidateWords.push({source: "stack" + index, value: value});
                  else if (index > 0 && index < 12) addMemorySnapshot("stack" + index, value, 96);
                } catch (error) {
                  stackWords.push({index: index, readError: String(error)});
                }
              }
            } catch (error) {
              memoryReadErrors.push({source: "stack", error: String(error)});
            }
            try {
              const ebp = context.ebp;
              for (let offset = -16; offset <= 32; offset += 4) {
                try {
                  const slot = offset < 0 ? ebp.sub(-offset) : ebp.add(offset);
                  const value = slot.readU32();
                  frameWords.push({offset: offset, value: value, hex: "0x" + value.toString(16)});
                  if (value <= 0xffff) candidateWords.push({source: "ebp" + offset, value: value});
                } catch (error) {
                  frameWords.push({offset: offset, readError: String(error)});
                }
              }
            } catch (error) {
              memoryReadErrors.push({source: "frame", error: String(error)});
            }
            const seenNested = {};
            let queue = memorySnapshots.slice();
            for (let depth = 0; depth < 2 && nestedPointerSnapshots.length < 24; depth++) {
              const nextQueue = [];
              queue.forEach(function(entry) {
                if (nestedPointerSnapshots.length >= 24 || !entry.snapshot ||
                    entry.snapshot.status !== "readable") return;
                (entry.snapshot.pointerWords || []).forEach(function(pointerWord) {
                  if (nestedPointerSnapshots.length >= 24) return;
                  const pointerKey = pointerWord.hex;
                  if (seenNested[pointerKey] !== undefined || seenMemory[pointerKey] !== undefined) return;
                  seenNested[pointerKey] = true;
                  const nested = {
                    sources: [entry.sources[0] + ".dword+" + pointerWord.offset],
                    snapshot: npcDialogTracePointer(ptr(pointerWord.value), 64)
                  };
                  nestedPointerSnapshots.push(nested);
                  if (nested.snapshot.status === "readable") nextQueue.push(nested);
                });
              });
              queue = nextQueue;
            }
            const allMemorySnapshots = memorySnapshots.concat(nestedPointerSnapshots);
            const program15MemoryCandidates = [];
            const menuRowArrayCandidates = [];
            const menuRowCandidates = [];
            allMemorySnapshots.forEach(function(entry) {
              const source = entry.sources.join("|");
              const snapshot = entry.snapshot;
              if (!snapshot) return;
              (snapshot.program15Candidates || []).forEach(function(item) {
                program15MemoryCandidates.push({source: source, address: snapshot.address, candidate: item});
              });
              (snapshot.menuRowArrayCandidates || []).forEach(function(item) {
                menuRowArrayCandidates.push({source: source, address: snapshot.address, candidate: item});
              });
              (snapshot.menuRowCandidates || []).forEach(function(item) {
                menuRowCandidates.push({source: source, address: snapshot.address, candidate: item});
              });
            });
            return {
              function: name,
              address: address,
              registers: registers,
              args: argumentWords,
              stack: stackWords,
              frame: frameWords,
              programIndexCandidates: candidateWords.filter(function(item) {
                return item.value >= 11 && item.value <= 49;
              }),
              optionOrdinalCandidates: candidateWords.filter(function(item) {
                return item.value >= 0 && item.value <= 3;
              }),
              program15MemoryCandidates: program15MemoryCandidates.slice(0, 48),
              menuRowArrayCandidates: menuRowArrayCandidates.slice(0, 24),
              npcScriptKindRowCandidates: menuRowCandidates.slice(0, 48),
              menuObjectProbe: name === "npc_menu_dispatch_0x00457A90" ? {
                ecx: registers.ecx || null,
                ebp: registers.ebp || null,
                edi: registers.edi || null,
                esi: registers.esi || null,
                observedStackWords7And8: stackWords.length > 8
                  ? [stackWords[7].value, stackWords[8].value]
                  : null,
                argument1: argumentWords[1] || null,
                argument2: argumentWords[2] || null
              } : null,
              directMemorySnapshots: memorySnapshots,
              nestedPointerSnapshots: nestedPointerSnapshots,
              pointerSnapshots: allMemorySnapshots,
              memoryReadErrors: memoryReadErrors
            };
          }
          function installNpcDialogNativeTrace() {
            if (npcDialogNativeTraceInstalled) return;
            const targets = [
              {address: 0x00457A90, name: "npc_menu_dispatch_0x00457A90"},
              {address: 0x00457DE0, name: "npc_dialog_resource_0x00457DE0"},
              {address: 0x00457ADE, name: "npc_menu_ordinal0_callsite_0x00457ADE"},
              {address: 0x00457B44, name: "npc_menu_ordinal1_callsite_0x00457B44"}
            ];
            const installed = [];
            const errors = [];
            targets.forEach(function(target) {
              try {
                attachOnce("npc-dialog-native-trace:" + target.name, ptr(target.address), {
                  onEnter(args) {
                    const count = (npcDialogNativeTraceSequence += 1);
                    this.npcDialogTrace = npcDialogTraceSnapshot(
                      target.name, ptr(target.address).toString(), args, this.context
                    );
                    this.npcDialogTrace.sequence = count;
                    emit("npc_dialog_native_call_enter", this.npcDialogTrace);
                    if (target.address === 0x00457A90) {
                      emit("npc_menu_dispatch_lifecycle", {
                        phase: "enter",
                        function: target.name,
                        address: ptr(target.address).toString(),
                        sequence: count,
                        registers: this.npcDialogTrace.registers,
                        args: this.npcDialogTrace.args,
                        stack: this.npcDialogTrace.stack.slice(0, 10)
                      });
                    }
                  },
                  onLeave(retval) {
                    emit("npc_dialog_native_call_return", {
                      function: target.name,
                      address: ptr(target.address).toString(),
                      sequence: this.npcDialogTrace ? this.npcDialogTrace.sequence : null,
                      returnValue: retval.toString(),
