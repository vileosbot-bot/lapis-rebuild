              try { $windowVisible = [WinInput]::IsWindowVisible($gameHwnd) } catch { $windowVisible = $false }
              $clientSizeAfter = [WinInput]::GetClientSize($gameHwnd)
              $serverDisconnectLine = Get-ServerDisconnectLine $serverLog $shopBefore
              if (-not $processAlive -or -not $windowVisible -or $serverDisconnectLine) { break }
              if ([DateTime]::UtcNow -ge $nextHeartbeatProbe) {
                $heartbeatAfterClick = Get-ClientHeartbeatCount $clientLog
                if ($heartbeatAfterClick -gt $heartbeatBeforeClick) { break }
                $nextHeartbeatProbe = [DateTime]::UtcNow.AddSeconds(10)
              }
              Start-Sleep -Seconds 2
            }
            $heartbeatAfterClick = Get-ClientHeartbeatCount $clientLog
            $heartbeatAdvanced = $heartbeatAfterClick -gt $heartbeatBeforeClick
            $serverDisconnected = $null -ne $serverDisconnectLine
            Write-Host "NPC_POST_CLICK_SURVIVAL process_alive=$processAlive window_visible=$windowVisible client_size=$($clientSizeAfter -join 'x') heartbeat_before=$heartbeatBeforeClick heartbeat_after=$heartbeatAfterClick heartbeat_advanced=$heartbeatAdvanced server_disconnected=$serverDisconnected dispatch_returned_normally=$dispatchReturnedNormally"
            if (-not $processAlive -or -not $windowVisible -or $serverDisconnected -or -not $heartbeatAdvanced) {
              $clientLastLine = Get-LastLogLine $clientLog
              $serverLastLine = Get-LastLogLine $serverLog
              Write-Host "NPC_POST_CLICK_LAST_CLIENT_LOG_LINE: $clientLastLine"
              Write-Host "NPC_POST_CLICK_LAST_SERVER_LOG_LINE: $serverLastLine"
              if ($serverDisconnectLine) { Write-Host "NPC_POST_CLICK_SERVER_DISCONNECT_EVENT: $serverDisconnectLine" }
            }
            Shot "npc-menu-post-click-survival"
            $ordinal1Call = Wait-LogLine $clientLog 'npc_menu_ordinal1_callsite_0x00457B44' $clientBeforeOption1 10
            if (-not $ordinal1Call) {
              if (-not $processAlive -or -not $windowVisible -or $serverDisconnected) {
                throw "Text-center click ended or disconnected the game before ordinal 1; inspect dispatch lifecycle and last client/server log lines"
              }
              throw "Actual screenshot text-center click did not execute the ordinal-1 native callsite 0x00457B44"
            }
            Write-Host "NPC ordinal-1 native call confirmed: $ordinal1Call"
            if (-not $processAlive -or -not $windowVisible -or $serverDisconnected) {
              throw "Ordinal 1 was observed, but the game process/window/session ended before shop confirmation"
            }
            $nativeShopRequest = Wait-NativeShopRequest $clientBeforeOption1 15
            if (-not $nativeShopRequest) {
              throw "Client did not send the exact native 0x30 request (legacy_send length=5 hex=30ee52ffff) for target 21230 action -1"
            }
            Write-Host "NATIVE 0x30 SHOP REQUEST CONFIRMED: $nativeShopRequest"
            $shopOpened = Wait-LogLine $serverLog 'offline_shop_opened.*entity=21230.*program=15' $shopBefore 20
            if (-not $shopOpened) {
              throw "Client sent native 0x30 request but server did not report offline_shop_opened for entity 21230 program 15"
            }
            Write-Host "consumables shop opened: $shopOpened"
            Start-Sleep -Seconds 2
            Shot "shop-open"
            Shot "shop-before-purchase"

            $redBefore = Get-LogLineCount $serverLog
            Focus-Game
            [WinInput]::PressKey(0x24)
            [WinInput]::PressKey(0x0D)
            Start-Sleep -Seconds 2
            Shot "shop-red-quantity-dialog"
            Focus-Game
            [System.Windows.Forms.SendKeys]::SendWait("^a")
            [System.Windows.Forms.SendKeys]::SendWait("30")
            [System.Windows.Forms.SendKeys]::SendWait("{ENTER}")
            $redPurchase = Wait-ShopPurchase 4001 $redBefore
            if (-not $redPurchase) { throw "Recovery potion 4001 purchase of quantity 30 was not confirmed by server log" }
            Write-Host "RED POTION PURCHASE CONFIRMED: $redPurchase"
            Start-Sleep -Seconds 2
            Shot "shop-red-purchased"

            $blueBefore = Get-LogLineCount $serverLog
            Focus-Game
            [WinInput]::PressKey(0x24)
            for ($k = 0; $k -lt 4; $k++) { [WinInput]::PressKey(0x28) }
            [WinInput]::PressKey(0x0D)
            Start-Sleep -Seconds 2
            Shot "shop-blue-quantity-dialog"
            Focus-Game
            [System.Windows.Forms.SendKeys]::SendWait("^a")
            [System.Windows.Forms.SendKeys]::SendWait("30")
            [System.Windows.Forms.SendKeys]::SendWait("{ENTER}")
            $bluePurchase = Wait-ShopPurchase 4006 $blueBefore
            if (-not $bluePurchase) { throw "Magic potion 4006 purchase of quantity 30 was not confirmed by server log" }
            Write-Host "BLUE POTION PURCHASE CONFIRMED: $bluePurchase"
            Start-Sleep -Seconds 2
            Shot "shop-blue-purchased"

            Focus-Game
            [WinInput]::PressKey(0x1B)
            Start-Sleep -Seconds 1
            Click-Client 350 12
            Start-Sleep -Seconds 3
            Shot "inventory-after-potions"
            Focus-Game
            [WinInput]::PressKey(0x1B)
            Write-Host "POTION PURCHASE AUTOMATION COMPLETE: item 4001 x30 and item 4006 x30"
          }
          catch {
            $failureReason = $_.Exception.Message
            Write-Host "POTION ROUTE/AUTOMATION STOPPED: $failureReason"
            Shot "automation-stopped"
          }

          for ($i = 1; $i -le 16; $i++) {
            Start-Sleep -Seconds 30
            $n = "{0:D2}" -f $i
            Shot "shot-$n"
            $nd = Get-Process -Name NeoDark -ErrorAction SilentlyContinue
            if (-not $nd -and $i -ge 4) { Write-Host "NeoDark not running at shot $n; stopping loop"; break }
          }
          try { Stop-Process -Id $p.Id -Force -ErrorAction SilentlyContinue } catch {}
          try { Get-Process -Name NeoDark -ErrorAction SilentlyContinue | Stop-Process -Force -ErrorAction SilentlyContinue } catch {}
          try { Get-Process -Name python -ErrorAction SilentlyContinue | Where-Object { $_.Path -like "*runtime*" } | Stop-Process -Force -ErrorAction SilentlyContinue } catch {}
          Write-Host "--- NeoDark processes after stop ---"
          Get-Process -Name NeoDark -ErrorAction SilentlyContinue | Select-Object Id, ProcessName | Format-Table -AutoSize
          Write-Host "--- game stdout tail ---"
          Get-Content (Join-Path $ws "game-stdout.log") -Tail 30 -ErrorAction SilentlyContinue
          Write-Host "--- game stderr tail ---"
          Get-Content (Join-Path $ws "game-stderr.log") -Tail 30 -ErrorAction SilentlyContinue
          if ($failureReason) { throw $failureReason }

      - name: Collect logs
        shell: pwsh
        if: always()
        run: |
          New-Item -ItemType Directory -Force -Path collected | Out-Null
          Copy-Item precheck.log collected/ -ErrorAction SilentlyContinue
          Copy-Item game-stdout.log collected/ -ErrorAction SilentlyContinue
          Copy-Item game-stderr.log collected/ -ErrorAction SilentlyContinue
          Copy-Item npc-window-tree.txt collected/ -ErrorAction SilentlyContinue
          Copy-Item ybcs\runtime\logs\* collected/ -Recurse -ErrorAction SilentlyContinue
          Get-ChildItem collected -Recurse | Select-Object FullName, Length | Format-Table -AutoSize

      - name: Upload artifacts (screenshots + logs)
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ybcs-verify
          path: |
            screenshots/
            collected/
          retention-days: 30
