              $greetingBeforeShot = Join-Path $shotDir "npc-greeting-before-click.png"
            }
            Write-Host "NPC greeting click basis: Run #14 1024x768 screenshot; game client screen origin=(43,66); visible greeting glyph bounds approximately x=361..451 y=553..563; physical client click=(362,492) maps to screen=(405,558)"
            Click-Client 362 492
            Start-Sleep -Seconds 3
            $screenBounds = [System.Windows.Forms.Screen]::PrimaryScreen.Bounds
            $cursorMoved = [WinInput]::SetCursorPos($screenBounds.Right - 20, $screenBounds.Bottom - 40)
            if (-not $cursorMoved) { throw "Could not move cursor away before capturing NPC menu options" }
            Start-Sleep -Milliseconds 250
            Shot "npc-greeting-after-click"
            $greetingAfterShot = Join-Path $shotDir "npc-greeting-after-click.png"
            $dialogueResolved = Wait-LogLine $serverLog 'offline_native_npc_menu_dialogue_resolved.*entity=21230.*program=15' $greetingBefore 2
            $ordinal0Dispatch = Wait-LogLine $clientLog 'npc_menu_dispatch_lifecycle.*"phase":\s*"enter".*"dispatchOrdinal":\s*0' $clientBeforeGreeting 1
            $menuDiff = Get-DialogMenuDiff $greetingBeforeShot $greetingAfterShot
            Write-Host "NPC dialog pixel diff against pre-click screenshot: greeting=$($menuDiff.greeting) option1=$($menuDiff.option1) option2=$($menuDiff.option2)"
            if ($dialogueResolved -or $ordinal0Dispatch) {
              Write-Host "Greeting-area click selected the ordinal-0 dialogue route; do not click another menu item in this run"
              throw "Greeting-area click dispatched ordinal 0 dialogue; inspect server dialogue resolution and native dispatch lifecycle before any further input"
            }
            if ($menuDiff.option1 -lt 20 -or $menuDiff.option2 -lt 20) {
              throw "Greeting-area click did not visibly reveal both selectable menu rows; no option or purchase click attempted"
            }
            Write-Host "NPC selectable menu rows detected in screenshot: option1=$($menuDiff.option1) option2=$($menuDiff.option2)"
            Shot "npc-menu-options-visible"
            $visibleText = $menuDiff.option1Bounds
            if ($null -eq $visibleText -or $visibleText.width -lt 15 -or
                $visibleText.width -gt 80 -or $visibleText.height -lt 5 -or
                $visibleText.height -gt 18) {
              throw "Actual screenshot did not yield a bounded second-option text region; no option click attempted"
            }
            Write-Host "NPC second-option text bounds from this run screenshot: left=$($visibleText.left) top=$($visibleText.top) right=$($visibleText.right) bottom=$($visibleText.bottom) changedPixels=$($visibleText.changedPixels)"
            $clientOrigin = New-Object WinInput+POINT
            $clientOrigin.X = 0
            $clientOrigin.Y = 0
            if (-not [WinInput]::ClientToScreen($gameHwnd, [ref]$clientOrigin)) {
              throw "Could not resolve NeoDark client origin for screenshot-coordinate verification"
            }
            $screenX = [int]$visibleText.centerX
            $screenY = [int]$visibleText.centerY
            $clientX = [int][Math]::Round(($screenX - $clientOrigin.X) * 800.0 / $clientSize[0])
            $clientY = [int][Math]::Round(($screenY - $clientOrigin.Y) * 600.0 / $clientSize[1])
            if ($screenX -lt $clientOrigin.X -or $screenY -lt $clientOrigin.Y -or
                $screenX -ge ($clientOrigin.X + $clientSize[0]) -or
                $screenY -ge ($clientOrigin.Y + $clientSize[1])) {
              throw "Measured NPC option text center is outside the NeoDark client area: screen=($screenX,$screenY)"
            }
            Write-Host "NPC_TEXT_CENTER_MEASURED screenshot=$greetingAfterShot pixel_bounds=($($visibleText.left),$($visibleText.top))-($($visibleText.right),$($visibleText.bottom)) screen_center=($screenX,$screenY) logical_client=($clientX,$clientY)"
            $menuEvidence = $null
            $menuEvidenceDeadline = [DateTime]::UtcNow.AddSeconds(8)
            while ([DateTime]::UtcNow -lt $menuEvidenceDeadline -and $null -eq $menuEvidence) {
              if (Test-Path -LiteralPath $clientLog) {
                $rows = @(Get-Content -LiteralPath $clientLog -ErrorAction SilentlyContinue)
                for ($j = $clientBeforeGreeting; $j -lt $rows.Count; $j++) {
                  try {
                    $event = $rows[$j] | ConvertFrom-Json -ErrorAction Stop
                    if ($event.kind -ne "npc_menu_hit_test_return") { continue }
                    $menu = $event.value.menuObjectAfter
                    if ($null -eq $menu -or $null -eq $menu.fields -or
                        [int]$menu.fields.program -ne 15 -or
                        [int]$menu.fields.target -ne 21230 -or
                        [int]$menu.fields.state -ne 2 -or
                        $null -eq $menu.suggestedOrdinal1HitTestPoint) { continue }
                    $menuEvidence = $menu
                    break
                  } catch {}
                }
              }
              if ($null -eq $menuEvidence) { Start-Sleep -Milliseconds 200 }
            }
            if ($null -eq $menuEvidence) {
              throw "Could not read the live program-15 ordinal-1 hit rectangle; no menu option click attempted"
            }
            $ordinal1Row = $menuEvidence.rows | Where-Object { [int]$_.ordinal -eq 1 } | Select-Object -First 1
            if ($null -eq $ordinal1Row) {
              throw "Live menu object did not contain a Kind-2 ordinal-1 row; no menu option click attempted"
            }
            $hitRect = $ordinal1Row.hitRectAfterNativeOffset
            $relativeClickX = $clientX - [int]$menuEvidence.fields.originX
            $relativeClickY = $clientY - [int]$menuEvidence.fields.originY
            $screenshotPointInside = $relativeClickX -ge [int]$hitRect.left -and
              $relativeClickX -lt [int]$hitRect.right -and
              $relativeClickY -ge [int]$hitRect.top -and
              $relativeClickY -lt [int]$hitRect.bottom
            $nativeCenter = $menuEvidence.suggestedOrdinal1HitTestPoint
            $nativeCenterX = [int]$nativeCenter.x
            $nativeCenterY = [int]$nativeCenter.y
            $nativeCenterRelativeX = $nativeCenterX - [int]$menuEvidence.fields.originX
            $nativeCenterRelativeY = $nativeCenterY - [int]$menuEvidence.fields.originY
            $nativeCenterInside = $nativeCenterRelativeX -ge [int]$hitRect.left -and
              $nativeCenterRelativeX -lt [int]$hitRect.right -and
              $nativeCenterRelativeY -ge [int]$hitRect.top -and
              $nativeCenterRelativeY -lt [int]$hitRect.bottom
            if (-not $screenshotPointInside -or -not $nativeCenterInside) {
              throw "Screenshot-derived or native-center coordinate is outside the live ordinal-1 hit rectangle; no click attempted"
            }
            Write-Host "NPC_COORDINATE_COMPARISON screenshot_pixel_center=($($visibleText.centerX),$($visibleText.centerY)) screen=($screenX,$screenY) logical_client=($clientX,$clientY) native_hit_rect_center=($nativeCenterX,$nativeCenterY) native_hit_rect=($($hitRect.left),$($hitRect.top))-($($hitRect.right),$($hitRect.bottom)) object_origin=($($menuEvidence.fields.originX),$($menuEvidence.fields.originY)) screenshot_point_inside=$screenshotPointInside native_center_inside=$nativeCenterInside"
            Write-Host "NPC_COORDINATE_SELECTION: use Run-19-validated screenshot-derived logical point ($clientX,$clientY); (420,509) is the center of the same native hit rectangle, not a conflicting coordinate"
            function Wait-NpcHitTestOrdinal(
              [string]$logPath,
              [int]$afterLine,
              [int]$expectedOrdinal,
              [int]$expectedX,
              [int]$expectedY,
              [int]$timeoutSeconds
            ) {
              $deadline = [DateTime]::UtcNow.AddSeconds($timeoutSeconds)
              while ([DateTime]::UtcNow -lt $deadline) {
                if (Test-Path -LiteralPath $logPath) {
                  $rows = @(Get-Content -LiteralPath $logPath -ErrorAction SilentlyContinue)
                  for ($j = $afterLine; $j -lt $rows.Count; $j++) {
                    try {
                      $event = $rows[$j] | ConvertFrom-Json -ErrorAction Stop
                      if ($event.kind -ne "npc_menu_hit_test_return") { continue }
                      $value = $event.value
                      $menu = $value.menuObjectAfter
                      if ($null -eq $menu -or $null -eq $menu.fields -or $null -eq $value.point) { continue }
                      if ([int]$value.point.x -ne $expectedX -or [int]$value.point.y -ne $expectedY) { continue }
                      if ([int]$menu.fields.program -ne 15 -or
                          [int]$menu.fields.target -ne 21230 -or
                          [int]$menu.fields.state -ne 2 -or
                          [int]$menu.fields.selectedOrdinal -ne $expectedOrdinal -or
                          [int]$value.predictedOrdinal -ne $expectedOrdinal) { continue }
                      return $rows[$j]
                    } catch {}
                  }
                }
                Start-Sleep -Milliseconds 200
              }
              return $null
            }
            $clientBeforeOrdinal1Hover = Get-LogLineCount $clientLog
            $heartbeatBeforeOrdinal1Hover = Get-ClientHeartbeatCount $clientLog
            Write-Host "NPC_ORDINAL1_HOVER_BEGIN screen=($screenX,$screenY) logical_client=($clientX,$clientY) button_down_up_events_sent=0 wait_timeout_seconds=8"
            if (-not [WinInput]::SetCursorPos($screenX, $screenY)) {
              throw "Could not move cursor to the Run-19-validated ordinal-1 point; no menu option click attempted"
            }
            Start-Sleep -Milliseconds 900
            Shot "npc-menu-second-option-hover"
            $ordinal1HitTest = Wait-NpcHitTestOrdinal $clientLog $clientBeforeOrdinal1Hover 1 $clientX $clientY 8
            if (-not $ordinal1HitTest) {
              $heartbeatAfterOrdinal1Hover = Get-ClientHeartbeatCount $clientLog
              Write-Host "NPC_ORDINAL1_HOVER_TIMEOUT selectedOrdinal_not_confirmed=1 predictedOrdinal_not_confirmed=1 heartbeat_before=$heartbeatBeforeOrdinal1Hover heartbeat_after=$heartbeatAfterOrdinal1Hover timeout_seconds=8"
              throw "Ordinal-1 hover did not produce a native hit-test return with selectedOrdinal=1 and predictedOrdinal=1 within 8 seconds; no click attempted"
            }
            $ordinal1HoverEvent = $ordinal1HitTest | ConvertFrom-Json -ErrorAction Stop
            $ordinal1HoverValue = $ordinal1HoverEvent.value
            $ordinal1HoverMenu = $ordinal1HoverValue.menuObjectAfter
            $preClickSelectedOrdinal = [int]$ordinal1HoverMenu.fields.selectedOrdinal
            $preClickPredictedOrdinal = [int]$ordinal1HoverValue.predictedOrdinal
            if ([int]$ordinal1HoverMenu.fields.program -ne 15 -or
                [int]$ordinal1HoverMenu.fields.target -ne 21230 -or
                [int]$ordinal1HoverMenu.fields.state -ne 2 -or
                $preClickSelectedOrdinal -ne 1 -or
                $preClickPredictedOrdinal -ne 1 -or
                [int]$ordinal1HoverValue.point.x -ne $clientX -or
                [int]$ordinal1HoverValue.point.y -ne $clientY) {
              throw "Pre-click menu state changed or did not equal program=15 target=21230 state=2 selectedOrdinal=1 predictedOrdinal=1; no click attempted"
            }
            Write-Host "NPC_ORDINAL1_HOVER_CONFIRMED program=$($ordinal1HoverMenu.fields.program) target=$($ordinal1HoverMenu.fields.target) state=$($ordinal1HoverMenu.fields.state) selectedOrdinal=$preClickSelectedOrdinal predictedOrdinal=$preClickPredictedOrdinal logical_client=($clientX,$clientY) screen=($screenX,$screenY) heartbeat_before=$heartbeatBeforeOrdinal1Hover heartbeat_after=$(Get-ClientHeartbeatCount $clientLog)"
            Write-Host "NPC_ORDINAL1_PRECLICK_GATE: selectedOrdinal=1 AND predictedOrdinal=1 AND program=15 AND target=21230 AND state=2; all checks passed"
            $memoryMapSnapshot = Wait-LogLine $clientLog 'npc_process_memory_map_snapshot_end.*"phase":"pre-ordinal1-click"' $clientBeforeOrdinal1Hover 15
            if (-not $memoryMapSnapshot) {
              throw "Pre-click VirtualQuery full memory map snapshot did not complete; no purchase click attempted"
            }
            Write-Host "MEMORY_DIAGNOSTIC_MAP_COMPLETE: $memoryMapSnapshot"
            $packetDisassembly = Wait-LogLine $clientLog 'npc_native_disassembly.*"label":"packet-dispatch-0x004A6FD0"' $clientBeforeOrdinal1Hover 5
            $copyDisassembly = Wait-LogLine $clientLog 'npc_native_disassembly.*"label":"copy-function-0x004A7A70"' $clientBeforeOrdinal1Hover 5
            if ($packetDisassembly) { Write-Host "MEMORY_DIAGNOSTIC_PACKET_DISASSEMBLY: $packetDisassembly" }
            else { Write-Host "MEMORY_DIAGNOSTIC_PACKET_DISASSEMBLY: no decoded event; inspect npc_native_disassembly_error" }
            if ($copyDisassembly) { Write-Host "MEMORY_DIAGNOSTIC_COPY_DISASSEMBLY: $copyDisassembly" }
            else { Write-Host "MEMORY_DIAGNOSTIC_COPY_DISASSEMBLY: no decoded event; inspect npc_native_disassembly_error" }
            Write-Host "MEMORY_DIAGNOSTIC_ONLY_STOP: Run #23 will not click ordinal 1, will not invoke VirtualProtect, and will not send any shop request"
            throw "MEMORY_DIAGNOSTIC_ONLY_STOP_BEFORE_ORDINAL1_CLICK: collect memory map and native mapping API evidence before authorizing a runtime protection change"
            Shot "npc-menu-ordinal1-hover-confirmed"
            $clientBeforeOrdinal1Click = Get-LogLineCount $clientLog
            $serverBeforeShopOpen = Get-LogLineCount $serverLog
            Write-Host "NPC_ORDINAL1_CLICK_BEGIN label=购买消耗品 logical_client=($clientX,$clientY) screen=($screenX,$screenY) pre_click_selectedOrdinal=$preClickSelectedOrdinal pre_click_predictedOrdinal=$preClickPredictedOrdinal"
            Click-Screen $screenX $screenY
            Start-Sleep -Milliseconds 250
            Shot "npc-menu-ordinal1-after-click"
            $clickHandlerLine = Wait-LogLine $clientLog 'npc_menu_click_handler_enter' $clientBeforeOrdinal1Click 8
            if (-not $clickHandlerLine) {
              throw "No native NPC click-handler entry was observed after the ordinal-1 click"
            }
            $clickHandlerEvent = $clickHandlerLine | ConvertFrom-Json -ErrorAction Stop
            $clickMenu = $clickHandlerEvent.value.menuObject
            $clickPoint = $clickMenu.point
            if ([int]$clickMenu.fields.program -ne 15 -or
                [int]$clickMenu.fields.target -ne 21230 -or
                [int]$clickMenu.fields.state -ne 2 -or
                [int]$clickMenu.fields.selectedOrdinal -ne 1 -or
                [int]$clickMenu.predictedOrdinal -ne 1 -or
                [int]$clickPoint.x -ne $clientX -or
                [int]$clickPoint.y -ne $clientY) {
              throw "Native click-handler did not read program=15 target=21230 state=2 selectedOrdinal=1 predictedOrdinal=1 at the validated point"
            }
            Write-Host "NPC_ORDINAL1_CLICK_HANDLER_CONFIRMED selectedOrdinal=$($clickMenu.fields.selectedOrdinal) predictedOrdinal=$($clickMenu.predictedOrdinal) point=($($clickPoint.x),$($clickPoint.y))"
            $dispatchEnter = Wait-LogLine $clientLog 'npc_menu_dispatch_lifecycle.*"phase":\s*"enter".*"dispatchOrdinal":\s*1' $clientBeforeOrdinal1Click 8
            if (-not $dispatchEnter) {
              throw "The click-handler read ordinal 1 but native dispatch did not enter with ordinal=1"
            }
            Write-Host "NPC_ORDINAL1_NATIVE_DISPATCH_CONFIRMED: $dispatchEnter"
            $nativeExceptionLine = Wait-LogLine $clientLog 'npc_native_exception' $clientBeforeOrdinal1Click 3
            if ($nativeExceptionLine) {
              $nativeExceptionEvent = $nativeExceptionLine | ConvertFrom-Json -ErrorAction Stop
              $nativeExceptionValue = $nativeExceptionEvent.value
              Write-Host "NPC_ORDINAL1_NATIVE_EXCEPTION: type=$($nativeExceptionValue.type) address=$($nativeExceptionValue.address) operation=$($nativeExceptionValue.memory.operation) fault=$($nativeExceptionValue.memory.address) ESI=$($nativeExceptionValue.context.esi) EDI=$($nativeExceptionValue.context.edi) ESI_range=$($nativeExceptionValue.memoryRanges.esi.status):$($nativeExceptionValue.memoryRanges.esi.protection) EDI_range=$($nativeExceptionValue.memoryRanges.edi.status):$($nativeExceptionValue.memoryRanges.edi.protection)"
              Write-Host "NPC_ORDINAL1_NATIVE_EXCEPTION_FULL: $nativeExceptionLine"
              throw "Ordinal-1 native packet path raised $($nativeExceptionValue.type) at $($nativeExceptionValue.address); no 0x30 request was sent"
            }
            $packetDispatch = Wait-LogLine $clientLog 'npc_native_packet_dispatch_enter.*"returnAddress":\s*"0x457b49"' $clientBeforeOrdinal1Click 8
            if (-not $packetDispatch) {
              throw "0x004A6FD0 was not called directly from native ordinal-1 callsite return address 0x457B49"
            }
            $packetEvent = $packetDispatch | ConvertFrom-Json -ErrorAction Stop
            $packetValue = $packetEvent.value
            if ([int]$packetValue.length -ne 5 -or
                $null -eq $packetValue.packetHex -or
                $packetValue.packetHex.Length -lt 10 -or
                $packetValue.packetHex.Substring(0,10).ToLowerInvariant() -ne "30ee52ffff") {
              throw "Native 0x004A6FD0 arguments were not length=5 with packet prefix 30ee52ffff: $packetDispatch"
            }
            Write-Host "NPC_ORDINAL1_PACKET_DISPATCH_ENTRY: $packetDispatch"
            $copyBufferLine = Wait-LogLine $clientLog 'npc_native_copy_buffer_enter' $clientBeforeOrdinal1Click 8
            if (-not $copyBufferLine) {
              throw "Native copy function 0x004A7A70 entry was not observed"
            }
            $copyBufferEvent = $copyBufferLine | ConvertFrom-Json -ErrorAction Stop
            $copyBufferValue = $copyBufferEvent.value
            if ([int]$copyBufferValue.copyLength -ne 5 -or
                $null -eq $copyBufferValue.sourcePreview -or
                $copyBufferValue.sourcePreview.Length -lt 10 -or
                $copyBufferValue.sourcePreview.Substring(0,10).ToLowerInvariant() -ne "30ee52ffff") {
              throw "Native copy function did not receive the bounded 5-byte 0x30 packet: $copyBufferLine"
            }
            Write-Host "NPC_ORDINAL1_COPY_BUFFER_ENTRY: $copyBufferLine"
            $nativeShopRequest = Wait-NativeShopRequest $clientBeforeOrdinal1Click 15
            if (-not $nativeShopRequest) {
              throw "Client entered native packet dispatch but did not send native 0x30 request 30ee52ffff for target 21230 action -1"
            }
            Write-Host "NATIVE_0x30_SHOP_REQUEST_CONFIRMED: $nativeShopRequest"
            $shopOpened = Wait-LogLine $serverLog 'offline_shop_opened.*entity=21230.*program=15' $serverBeforeShopOpen 20
            if (-not $shopOpened) {
              throw "Native 0x30 request was sent but server did not report offline_shop_opened for entity 21230 program 15"
            }
            Write-Host "consumables shop opened: $shopOpened"
            Start-Sleep -Seconds 2
            Shot "shop-open"
            Shot "shop-before-purchase"

            $redBefore = Get-LogLineCount $serverLog
            Focus-Game
            [WinInput]::PressKey(0x24)
            [WinInput]::PressKey(0x0D)
            Start-Sleep -Seconds 2
            Shot "shop-red-quantity-dialog"
            Focus-Game
            [System.Windows.Forms.SendKeys]::SendWait("^a")
            [System.Windows.Forms.SendKeys]::SendWait("30")
            [System.Windows.Forms.SendKeys]::SendWait("{ENTER}")
            $redPurchase = Wait-ShopPurchase 4001 $redBefore
            if (-not $redPurchase) { throw "Recovery potion 4001 purchase of quantity 30 was not confirmed by server log" }
            Write-Host "RED POTION PURCHASE CONFIRMED: $redPurchase"
            Start-Sleep -Seconds 2
            Shot "shop-red-purchased"

            $blueBefore = Get-LogLineCount $serverLog
            Focus-Game
            [WinInput]::PressKey(0x24)
            for ($k = 0; $k -lt 4; $k++) { [WinInput]::PressKey(0x28) }
            [WinInput]::PressKey(0x0D)
            Start-Sleep -Seconds 2
            Shot "shop-blue-quantity-dialog"
            Focus-Game
            [System.Windows.Forms.SendKeys]::SendWait("^a")
            [System.Windows.Forms.SendKeys]::SendWait("30")
            [System.Windows.Forms.SendKeys]::SendWait("{ENTER}")
            $bluePurchase = Wait-ShopPurchase 4006 $blueBefore
            if (-not $bluePurchase) { throw "Magic potion 4006 purchase of quantity 30 was not confirmed by server log" }
            Write-Host "BLUE POTION PURCHASE CONFIRMED: $bluePurchase"
            Start-Sleep -Seconds 2
            Shot "shop-blue-purchased"

            Focus-Game
            [WinInput]::PressKey(0x1B)
            Start-Sleep -Seconds 1
            Click-Client 350 12
            Start-Sleep -Seconds 3
            Shot "inventory-after-potions"
            Focus-Game
            [WinInput]::PressKey(0x1B)
            Write-Host "POTION PURCHASE AUTOMATION COMPLETE: item 4001 x30 and item 4006 x30"
          }
          catch {
            $failureReason = $_.Exception.Message
            Write-Host "POTION ROUTE/AUTOMATION STOPPED: $failureReason"
            Shot "automation-stopped"
          }

          for ($i = 1; $i -le 16; $i++) {
            Start-Sleep -Seconds 30
            $n = "{0:D2}" -f $i
            Shot "shot-$n"
            $nd = Get-Process -Name NeoDark -ErrorAction SilentlyContinue
            if (-not $nd -and $i -ge 4) { Write-Host "NeoDark not running at shot $n; stopping loop"; break }
          }
          try { Stop-Process -Id $p.Id -Force -ErrorAction SilentlyContinue } catch {}
          try { Get-Process -Name NeoDark -ErrorAction SilentlyContinue | Stop-Process -Force -ErrorAction SilentlyContinue } catch {}
          try { Get-Process -Name python -ErrorAction SilentlyContinue | Where-Object { $_.Path -like "*runtime*" } | Stop-Process -Force -ErrorAction SilentlyContinue } catch {}
          Write-Host "--- NeoDark processes after stop ---"
          Get-Process -Name NeoDark -ErrorAction SilentlyContinue | Select-Object Id, ProcessName | Format-Table -AutoSize
          Write-Host "--- game stdout tail ---"
          Get-Content (Join-Path $ws "game-stdout.log") -Tail 30 -ErrorAction SilentlyContinue
          Write-Host "--- game stderr tail ---"
          Get-Content (Join-Path $ws "game-stderr.log") -Tail 30 -ErrorAction SilentlyContinue
          if ($failureReason) { throw $failureReason }

      - name: Collect logs
        shell: pwsh
        if: always()
        run: |
          New-Item -ItemType Directory -Force -Path collected | Out-Null
          Copy-Item precheck.log collected/ -ErrorAction SilentlyContinue
          Copy-Item game-stdout.log collected/ -ErrorAction SilentlyContinue
          Copy-Item game-stderr.log collected/ -ErrorAction SilentlyContinue
          Copy-Item npc-window-tree.txt collected/ -ErrorAction SilentlyContinue
          Copy-Item ybcs\runtime\logs\* collected/ -Recurse -ErrorAction SilentlyContinue
          Get-ChildItem collected -Recurse | Select-Object FullName, Length | Format-Table -AutoSize

      - name: Upload artifacts (screenshots + logs)
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ybcs-verify
          path: |
            screenshots/
            collected/
          retention-days: 30
