name: ybcs-offline-verify

on:
  push:
    branches: [ybcs-verify]
    paths: ['.github/workflows/ybcs-verify.yml']
  workflow_dispatch:

jobs:
  verify:
    runs-on: windows-latest
    timeout-minutes: 120
    steps:
      - name: Download ybcs-offline.zip (public Drive link)
        shell: pwsh
        run: |
          pip install gdown
          gdown "https://drive.google.com/uc?export=download&id=1qNOt9-aMiN8dZsh2FOlT5rhltZCyeFvt" -O ybcs-offline.zip
          $h = (Get-FileHash ybcs-offline.zip -Algorithm SHA256).Hash.ToLower()
          Write-Host "SHA256: $h"
          if ($h -ne "d79c012177c8b1701188a90825539466d28cc18dc87b3c62361b4960b315724d") { throw "SHA-256 mismatch" }
          Write-Host "SHA OK, size:" (Get-Item ybcs-offline.zip).Length

      - name: Extract package
        shell: pwsh
        run: |
          Expand-Archive ybcs-offline.zip -DestinationPath ybcs
          Write-Host "--- top level ---"
          Get-ChildItem ybcs | Select-Object Name, Length | Format-Table -AutoSize
          Write-Host "--- launcher cmd files ---"
          Get-ChildItem ybcs -Filter "*.cmd" -Recurse | Select-Object FullName | Format-Table -AutoSize

      - name: Pre-check (no GUI, exit code recorded)
        shell: pwsh
        run: |
          cd ybcs
          $launcher = Get-ChildItem -Filter "*单机游戏.cmd" | Select-Object -First 1
          if (-not $launcher) { $launcher = Get-ChildItem -Filter "*.cmd" | Select-Object -First 1 }
          Write-Host "launcher: $($launcher.Name)"
          cmd /c "`"$($launcher.Name)`" --check --no-pause" 2>&1 | Tee-Object -FilePath ..\precheck.log
          Write-Host "precheck exit code: $LASTEXITCODE"
          if ($LASTEXITCODE -ne 0) { Write-Host "PRECHECK FAILED (exit $LASTEXITCODE) - see precheck.log" }

      - name: Launch game and screenshot
        shell: pwsh
        run: |
          $ws = $env:GITHUB_WORKSPACE
          $shotDir = Join-Path $ws "screenshots"
          New-Item -ItemType Directory -Force -Path $shotDir | Out-Null
          $clientLog = Join-Path $ws "ybcs\runtime\logs\ybcs-gui-client.jsonl"
          $serverLog = Join-Path $ws "ybcs\runtime\logs\ybcs-gui-server.log"
          cd ybcs
          $neodarkPath = Join-Path $ws "ybcs\runtime\client\NeoDark.exe"
          if (-not (Test-Path -LiteralPath $neodarkPath)) { throw "NeoDark.exe missing from the verified offline package: $neodarkPath" }
          $neoHash = (Get-FileHash -LiteralPath $neodarkPath -Algorithm SHA256).Hash.ToLowerInvariant()
          Write-Host "STATIC_BINARY path=$neodarkPath sha256=$neoHash"
          if ($neoHash -ne "c1be05eb2977a8aae8cbe8b716bc1e3957263edde8187d5269d554b327f13cbd") {
            throw "NeoDark.exe differs from the binary used for the offline static disassembly"
          }
          Write-Host "STATIC_UNPACK UPX_PE32 method=2(NRV2B) filter=0x26 cto=0x1b; compressed/uncompressed Adler-32 checks matched; binary was not executed for static analysis"
          Write-Host "STATIC_DISPATCH_ANALYSIS binary=NeoDark.exe image_base=0x00400000 architecture=PE32"
          Write-Host "STATIC_HIT_TEST 0x004572A0: x_rel=arg0-[this+0x14]; y_rel=arg1-[this+0x18]; rows=[this+0x110..this+0x114] pointer array; row.Kind=[row+0]; active_kind=[this+0x11c]; RECT=[row+0x4]; transform=(dx=+20,dy=-15) via [0x004E2478]; point-in-rect via [0x004E2510]; hit stores ordinal at [this+0x120], no hit stores -1 at 0x004573C2"
          Write-Host "STATIC_ORDINAL_RULE: only rows whose Kind equals [this+0x11c] are eligible; eligible ordinal starts at 0 and increments after each miss; first containing RECT wins"
          Write-Host "STATIC_CLICK_HANDLER 0x004571F0: if [this+0x11c]==2 then push [this+0x120] and call 0x00457A90"
          Write-Host "STATIC_DISPATCH 0x00457A90: ordinal=[esp+0x4]; range 0..3; jump table=[0x00457CB8+ordinal*4]"
          Write-Host "STATIC_ORDINAL0 0x00457ADE: packet=[0x49,0x09,word([this+0x108])] length=4; call target=0x004A6FD0"
          Write-Host "STATIC_ORDINAL1 0x00457B44: packet=[0x30,word([this+0x108]),word(action)] length=5; action selected from ([this+0x104]-12) lookup table; call target=0x004A6FD0"
          Write-Host "STATIC_DISPATCH_TAIL 0x00457CA0: call 0x004186E0 then return; packet dispatcher 0x004A6FD0 has error branches to 0x004D94D1"
          $npcPatch = @'
          from pathlib import Path

          path = Path("src/legacy_gui_runtime/ybcs_emulated_launcher.py")
          original = path.read_bytes()

          old_enter = b'''      onEnter(args) {
                  this.offlineNpcClick = null;
                  const scene = this.context.ecx;
                  const relativePoint = args[0];
                  const target = offlineNpcWorldEntityAt(scene, relativePoint);
                  if (target === null) return;
                  const mapWire = safeS16(ptr(0x004F48B4));
                  const entityId = safeU16(target.add(0xB4));
                  const row = offlineNpcSingleClickRow(mapWire, entityId);
                  if (row === null) return;
                  this.offlineNpcClick = {
                    target: target,
                    row: row,
                    mapWire: mapWire
                  };
                },
          '''
          new_enter = b'''      onEnter(args) {
                  this.offlineNpcClick = null;
                  const scene = this.context.ecx;
                  const relativePoint = args[0];
                  const relativeX = safeDword(relativePoint, true);
                  const relativeY = safeDword(relativePoint.add(4), true);
                  const sceneOffsetX = safeDword(scene.add(0x25C4), true);
                  const sceneOffsetY = safeDword(scene.add(0x25C8), true);
                  let clickedCell = null;
                  if (relativeX !== null && relativeY !== null &&
                      sceneOffsetX !== null && sceneOffsetY !== null) {
                    clickedCell = offlineNpcScreenToCell(
                      relativeX + sceneOffsetX, relativeY + sceneOffsetY
                    );
                  }
                  const target = offlineNpcWorldEntityAt(scene, relativePoint);
                  const mapWire = safeS16(ptr(0x004F48B4));
                  const entityId = target === null ? null : safeU16(target.add(0xB4));
                  const row = target === null
                    ? null
                    : offlineNpcSingleClickRow(mapWire, entityId);
                  emit("offline_npc_single_click_probe", {
                    mapWire: mapWire,
                    relativeX: relativeX,
                    relativeY: relativeY,
                    sceneOffsetX: sceneOffsetX,
                    sceneOffsetY: sceneOffsetY,
                    clickedCell: clickedCell,
                    targetFound: target !== null,
                    targetEntityId: entityId,
                    targetCell: target === null ? null : [
                      safeDword(target.add(0xD4), true),
                      safeDword(target.add(0xD8), true)
                    ],
                    rowFound: row !== null
                  });
                  if (target === null || row === null) return;
                  this.offlineNpcClick = {
                    target: target,
                    row: row,
                    mapWire: mapWire
                  };
                },
          '''

          old_leave = b'''      onLeave() {
                  if (this.offlineNpcClick === null) return;
                  const click = this.offlineNpcClick;
                  const selected = selectedWorldEntity();
                  if (selected === null || !selected.equals(click.target)) return;
                  const self = offlineNpcCurrentSelf();
                  if (self === null || self.equals(selected)) return;
                  const distance = offlineNpcInteractionDistance(self, selected);
                  const accepted = distance !== null &&
                    distance < OFFLINE_NPC_SINGLE_CLICK_DISTANCE;
          '''
          new_leave = b'''      onLeave() {
                  if (this.offlineNpcClick === null) return;
                  const click = this.offlineNpcClick;
                  const nativeSelected = selectedWorldEntity();
                  const nativeSelectionMatches = nativeSelected !== null &&
                    nativeSelected.equals(click.target);
                  const self = offlineNpcCurrentSelf();
                  const distance = self === null || self.equals(click.target)
                    ? null
                    : offlineNpcInteractionDistance(self, click.target);
                  emit("offline_npc_single_click_candidate", {
                    mapWire: click.mapWire,
                    entityId: click.row.entityId,
                    role: click.row.role,
                    nativeSelectedEntityId: nativeSelected === null
                      ? null
                      : safeS16(nativeSelected.add(0xB4)),
                    nativeSelectionMatches: nativeSelectionMatches,
                    sceneSelectedId: safeDword(ptr(0x00A399D8).add(0x800), true),
                    playerCell: self === null ? null : [
                      safeDword(self.add(0xD4), true),
                      safeDword(self.add(0xD8), true)
                    ],
                    targetCell: [
                      safeDword(click.target.add(0xD4), true),
                      safeDword(click.target.add(0xD8), true)
                    ],
                    distance: distance,
                    exclusiveDistanceLimit: OFFLINE_NPC_SINGLE_CLICK_DISTANCE
                  });
                  if (distance === null) return;
                  const accepted = distance < OFFLINE_NPC_SINGLE_CLICK_DISTANCE;
          '''

          if original.count(old_enter) != 1:
              raise SystemExit(f"NPC onEnter anchor count must be 1, got {original.count(old_enter)}")
          if original.count(old_leave) != 1:
              raise SystemExit(f"NPC onLeave anchor count must be 1, got {original.count(old_leave)}")

          patched = original.replace(old_enter, new_enter, 1).replace(old_leave, new_leave, 1)
          compile(patched.decode("utf-8"), str(path), "exec")
          if b"if (selected === null || !selected.equals(click.target)) return;" in patched:
              raise SystemExit("stale selected-world-entity gate remains")
          if b"offlineNpcInteractionDistance(self, click.target)" not in patched:
              raise SystemExit("distance check is not bound to exact clicked NPC")
          if b"queueOfflineNpcSingleClick(" not in patched:
              raise SystemExit("original exact 0x08 sender is missing")
          old_trace_anchor = b'''const offlineNpcSingleClickInstallTimer = setTimeout(
            installOfflineNpcSingleClickInteraction,
            OFFLINE_NPC_SINGLE_CLICK_INSTALL_DELAY_MS
          );
          '''
          new_trace_anchor = b'''          let npcDialogNativeTraceInstalled = false;
          let npcDialogNativeTraceSequence = 0;
          let npcExitTraceInstalled = false;
          function npcDialogTraceHex(bytes) {
            return Array.from(bytes).map(function(value) {
              return (value < 16 ? "0" : "") + value.toString(16);
            }).join("");
          }
          function npcDialogTraceBacktrace(context) {
            try {
              return Thread.backtrace(context, Backtracer.ACCURATE).map(function(address) {
                let symbol = null;
                try { symbol = DebugSymbol.fromAddress(address).toString(); } catch (_) {}
                return {address: address.toString(), symbol: symbol};
              });
            } catch (error) {
              return [{error: String(error)}];
            }
          }
          function npcDialogTraceReadMenuObject(value, source, point) {
            let addressText = null;
            try {
              const base = ptr(value);
              addressText = base.toString();
              if (base.isNull() || base.toUInt32() < 0x10000) {
                return {status: "not-menu-pointer", source: source, address: addressText};
              }
              const raw = base.readVolatile(0x124);
              if (raw === null) {
                return {status: "not-readable", source: source, address: addressText, bytes: 0};
              }
              const view = new DataView(raw);
              const fields = {
                program: view.getInt32(0x104, true),
                target: view.getUint16(0x108, true),
                originX: view.getInt32(0x14, true),
                originY: view.getInt32(0x18, true),
                rowsBegin: view.getUint32(0x110, true),
                rowsEnd: view.getUint32(0x114, true),
                state: view.getInt32(0x11c, true),
                selectedOrdinal: view.getInt32(0x120, true)
              };
              const relativePoint = point === null ? null : {
                x: point.x - fields.originX,
                y: point.y - fields.originY
              };
              const rows = [];
              const rowErrors = [];
              let rowArrayStatus = "unavailable";
              let eligibleOrdinal = 0;
              const byteLength = fields.rowsEnd - fields.rowsBegin;
              if (fields.rowsBegin >= 0x10000 && fields.rowsEnd >= fields.rowsBegin &&
                  byteLength % 4 === 0 && byteLength <= 128) {
                const count = byteLength / 4;
                const pointerBytes = count === 0 ? new ArrayBuffer(0) : ptr(fields.rowsBegin).readVolatile(byteLength);
                if (pointerBytes === null) {
                  rowArrayStatus = "pointer-array-not-readable";
                } else {
                  rowArrayStatus = "readable";
                  const pointerView = new DataView(pointerBytes);
                  for (let index = 0; index < count; index++) {
                    try {
                      const rowAddress = pointerView.getUint32(index * 4, true);
                      if (rowAddress < 0x10000) {
                        rowErrors.push({rowIndex: index, status: "invalid-row-pointer", address: "0x" + rowAddress.toString(16)});
                        continue;
                      }
                      const rowBytes = ptr(rowAddress).readVolatile(0x14);
                      if (rowBytes === null) {
                        rowErrors.push({rowIndex: index, status: "row-not-readable", address: "0x" + rowAddress.toString(16)});
                        continue;
                      }
                      const rowView = new DataView(rowBytes);
                      const kind = rowView.getUint8(0);
                      const left = rowView.getInt32(4, true);
                      const top = rowView.getInt32(8, true);
                      const right = rowView.getInt32(12, true);
                      const bottom = rowView.getInt32(16, true);
                      const eligible = kind === fields.state;
                      const ordinal = eligible ? eligibleOrdinal : null;
                      const hitRect = {
                        left: left + 20,
                        top: top - 15,
                        right: right + 20,
                        bottom: bottom - 15
                      };
                      const contains = eligible && relativePoint !== null &&
                        relativePoint.x >= hitRect.left && relativePoint.x < hitRect.right &&
                        relativePoint.y >= hitRect.top && relativePoint.y < hitRect.bottom;
                      rows.push({
                        rowIndex: index,
                        address: "0x" + rowAddress.toString(16),
                        kind: kind,
                        eligibleForCurrentState: eligible,
                        ordinal: ordinal,
                        rawRect: {left: left, top: top, right: right, bottom: bottom},
                        hitRectAfterNativeOffset: hitRect,
                        containsPoint: contains
                      });
                      if (eligible) eligibleOrdinal++;
                    } catch (rowError) {
                      rowErrors.push({rowIndex: index, error: String(rowError)});
                    }
                  }
                }
              } else {
                rowArrayStatus = "invalid-vector-bounds";
              }
              const hitRows = rows.filter(function(row) { return row.containsPoint; });
              const secondRow = rows.find(function(row) {
                return row.eligibleForCurrentState && row.ordinal === 1;
              });
              let suggestedHitTestPoint = null;
              if (secondRow !== undefined) {
                suggestedHitTestPoint = {
                  x: fields.originX + Math.floor((secondRow.hitRectAfterNativeOffset.left + secondRow.hitRectAfterNativeOffset.right) / 2),
                  y: fields.originY + Math.floor((secondRow.hitRectAfterNativeOffset.top + secondRow.hitRectAfterNativeOffset.bottom) / 2)
                };
              }
              return {
                status: "readable",
                source: source,
                address: addressText,
                fields: fields,
                rowArrayStatus: rowArrayStatus,
                rows: rows,
                rowErrors: rowErrors,
                point: point,
                relativePoint: relativePoint,
                predictedOrdinal: hitRows.length > 0 ? hitRows[0].ordinal : null,
                containingRows: hitRows.map(function(row) { return row.rowIndex; }),
                suggestedOrdinal1HitTestPoint: suggestedHitTestPoint
              };
            } catch (error) {
              return {status: "read-error", source: source, address: addressText, error: String(error)};
            }
          }
          function npcDialogTraceSnapshot(name, address, args, context) {
            const registers = {};
            const argumentWords = [];
            const stackWords = [];
            const memoryReadErrors = [];
            ["eax", "ebx", "ecx", "edx", "esi", "edi", "ebp", "esp", "eip"].forEach(function(registerName) {
              try {
                registers[registerName] = context[registerName].toString();
              } catch (error) {
                memoryReadErrors.push({source: "register." + registerName, error: String(error)});
              }
            });
            for (let index = 0; index < 8; index++) {
              try {
                const value = args[index];
                argumentWords.push({index: index, value: value.toString(), u32: value.toUInt32()});
              } catch (_) {}
            }
            try {
              const esp = context.esp;
              for (let index = 0; index < 12; index++) {
                try {
                  const value = esp.add(index * 4).readU32();
                  stackWords.push({index: index, value: value, hex: "0x" + value.toString(16)});
                } catch (error) {
                  stackWords.push({index: index, readError: String(error)});
                }
              }
            } catch (error) {
              memoryReadErrors.push({source: "stack", error: String(error)});
            }
            let menuObjectAddress = null;
            let point = null;
            if (name === "npc_menu_hit_test_0x004572A0" ||
                name === "npc_menu_click_handler_0x004571F0") {
              menuObjectAddress = context.ecx;
              try { point = {x: args[0].toInt32(), y: args[1].toInt32()}; }
              catch (error) { memoryReadErrors.push({source: "mouse-arguments", error: String(error)}); }
            } else if (name === "npc_menu_dispatch_0x00457A90") {
              menuObjectAddress = context.ecx;
              if (stackWords.length > 8) point = {x: stackWords[7].value, y: stackWords[8].value};
            } else if (name === "npc_menu_ordinal0_callsite_0x00457ADE" ||
                       name === "npc_menu_ordinal1_callsite_0x00457B44") {
              menuObjectAddress = context.esi;
            }
            const menuObject = menuObjectAddress === null
              ? null
              : npcDialogTraceReadMenuObject(menuObjectAddress,
                  name.indexOf("ordinal") >= 0 ? "context.esi" : "context.ecx", point);
            return {
              function: name,
              address: address,
              registers: registers,
              args: argumentWords,
              stack: stackWords,
              dispatchOrdinal: name === "npc_menu_dispatch_0x00457A90" && argumentWords.length > 0
                ? argumentWords[0].u32
                : null,
              menuObject: menuObject,
              memoryReadErrors: memoryReadErrors
            };
          }
          function npcDialogTraceInstallExceptionAndExitHooks() {
            if (npcExitTraceInstalled) return;
            const installed = [];
            const errors = [];
            try {
              const handlerInstalled = Process.setExceptionHandler(function(details) {
                const backtrace = npcDialogTraceBacktrace(details.context);
                const context = {};
                try {
                  ["eip", "esp", "eax", "ebx", "ecx", "edx", "esi", "edi", "ebp"].forEach(function(name) {
                    if (details.context[name] !== undefined) context[name] = details.context[name].toString();
                  });
                } catch (_) {}
                emit("npc_native_exception", {
                  type: details.type,
                  address: details.address ? details.address.toString() : null,
                  memory: details.memory ? {
                    operation: details.memory.operation,
                    address: details.memory.address ? details.memory.address.toString() : null
                  } : null,
                  context: context,
                  backtrace: backtrace
                });
                return false;
              });
              installed.push({name: "Process.setExceptionHandler", installed: handlerInstalled});
            } catch (error) {
              errors.push({name: "Process.setExceptionHandler", error: String(error)});
            }
            const exports = [
              {moduleName: "kernel32.dll", exportName: "ExitProcess"},
              {moduleName: "kernel32.dll", exportName: "TerminateProcess"},
              {moduleName: "kernel32.dll", exportName: "RaiseException"},
              {moduleName: "ntdll.dll", exportName: "NtTerminateProcess"},
              {moduleName: "ntdll.dll", exportName: "RtlExitUserProcess"},
              {moduleName: "ntdll.dll", exportName: "RtlRaiseException"}
            ];
            exports.forEach(function(item) {
              try {
                const module = Process.getModuleByName(item.moduleName);
                const targetAddress = module.getExportByName(item.exportName);
                attachOnce("npc-process-exit-trace:" + item.moduleName + ":" + item.exportName, targetAddress, {
                  onEnter(args) {
                    const values = [];
                    for (let index = 0; index < 4; index++) {
                      try { values.push(args[index].toString()); } catch (_) { values.push(null); }
                    }
                    emit("npc_process_exit_api_enter", {
                      module: item.moduleName,
                      name: item.exportName,
                      address: targetAddress.toString(),
                      args: values,
                      backtrace: npcDialogTraceBacktrace(this.context)
                    });
                  }
                });
                installed.push({module: item.moduleName, name: item.exportName, address: targetAddress.toString()});
              } catch (error) {
                errors.push({module: item.moduleName, name: item.exportName, error: String(error)});
              }
            });
            npcExitTraceInstalled = installed.length > 0;
            emit("npc_process_exit_trace_installed", {installed: installed, errors: errors});
          }
          function installNpcDialogNativeTrace() {
            if (npcDialogNativeTraceInstalled) return;
            const targets = [
              {address: 0x004572A0, name: "npc_menu_hit_test_0x004572A0"},
              {address: 0x004571F0, name: "npc_menu_click_handler_0x004571F0"},
              {address: 0x00457A90, name: "npc_menu_dispatch_0x00457A90"},
              {address: 0x00457DE0, name: "npc_dialog_resource_0x00457DE0"},
              {address: 0x00457ADE, name: "npc_menu_ordinal0_callsite_0x00457ADE"},
              {address: 0x00457B44, name: "npc_menu_ordinal1_callsite_0x00457B44"},
              {address: 0x004A6FD0, name: "npc_packet_dispatch_0x004A6FD0"},
              {address: 0x004186E0, name: "npc_menu_dispatch_tail_0x004186E0"},
              {address: 0x004D94D1, name: "native_cpp_throw_helper_0x004D94D1"}
            ];
            const installed = [];
            const errors = [];
            targets.forEach(function(target) {
              try {
                attachOnce("npc-dialog-native-trace:" + target.name, ptr(target.address), {
                  onEnter(args) {
                    const returnAddress = this.returnAddress ? this.returnAddress.toString() : null;
                    if (target.address === 0x004186E0 && returnAddress !== "0x457caf") return;
                    if (target.address === 0x004A6FD0 &&
                        returnAddress !== "0x457ae3" && returnAddress !== "0x457b49") return;
                    if (target.address === 0x004D94D1 &&
                        returnAddress !== "0x4a70f6" && returnAddress !== "0x4a71f4") return;
                    const count = (npcDialogNativeTraceSequence += 1);
                    if (target.address === 0x004A6FD0) {
                      let packetHex = null;
                      let packetReadError = null;
                      try {
                        const length = Math.max(0, Math.min(args[0].toInt32(), 32));
                        const packet = ptr(args[1]).readVolatile(length);
                        packetHex = packet === null ? null : npcDialogTraceHex(Array.from(new Uint8Array(packet)));
                      } catch (error) {
                        packetReadError = String(error);
                      }
                      this.npcDialogPacketTrace = {
                        sequence: count,
                        length: args[0].toInt32(),
                        buffer: args[1].toString(),
                        packetHex: packetHex,
                        packetReadError: packetReadError,
                        returnAddress: returnAddress
                      };
                      emit("npc_native_packet_dispatch_enter", this.npcDialogPacketTrace);
                      return;
                    }
                    if (target.address === 0x004186E0) {
                      this.npcDialogTailTrace = {sequence: count, returnAddress: returnAddress, ecx: this.context.ecx.toString()};
                      emit("npc_menu_dispatch_tail_enter", this.npcDialogTailTrace);
                      return;
                    }
                    if (target.address === 0x004D94D1) {
                      this.npcCppThrowTrace = {sequence: count, returnAddress: returnAddress, args: []};
                      for (let index = 0; index < 3; index++) {
                        try { this.npcCppThrowTrace.args.push(args[index].toString()); } catch (_) {}
                      }
                      emit("npc_cpp_exception_throw_helper_enter", this.npcCppThrowTrace);
                      return;
                    }
                    this.npcDialogTrace = npcDialogTraceSnapshot(
                      target.name, ptr(target.address).toString(), args, this.context
                    );
                    this.npcDialogTrace.sequence = count;
                    this.npcDialogTrace.returnAddress = returnAddress;
                    emit("npc_dialog_native_call_enter", this.npcDialogTrace);
                    if (target.address === 0x004572A0) emit("npc_menu_hit_test_enter", this.npcDialogTrace);
                    if (target.address === 0x004571F0) emit("npc_menu_click_handler_enter", this.npcDialogTrace);
                    if (target.address === 0x00457A90) {
                      emit("npc_menu_dispatch_lifecycle", {
                        phase: "enter",
                        function: target.name,
                        address: ptr(target.address).toString(),
                        sequence: count,
                        dispatchOrdinal: this.npcDialogTrace.dispatchOrdinal,
                        registers: this.npcDialogTrace.registers,
                        args: this.npcDialogTrace.args,
                        stack: this.npcDialogTrace.stack.slice(0, 10),
                        menuObject: this.npcDialogTrace.menuObject
                      });
                    }
                  },
                  onLeave(retval) {
                    if (target.address === 0x00457ADE || target.address === 0x00457B44) return;
                    if (target.address === 0x004A6FD0) {
                      if (!this.npcDialogPacketTrace) return;
                      emit("npc_native_packet_dispatch_return", {
                        sequence: this.npcDialogPacketTrace.sequence,
                        returnValue: retval.toString(),
