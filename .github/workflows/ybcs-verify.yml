name: ybcs-offline-verify

on:
  push:
    branches: [ybcs-verify]
    paths: ['.github/workflows/ybcs-verify.yml']
  workflow_dispatch:

jobs:
  verify:
    runs-on: windows-latest
    timeout-minutes: 120
    steps:
      - name: Download ybcs-offline.zip (public Drive link)
        shell: pwsh
        run: |
          pip install gdown
          gdown "https://drive.google.com/uc?export=download&id=1qNOt9-aMiN8dZsh2FOlT5rhltZCyeFvt" -O ybcs-offline.zip
          $h = (Get-FileHash ybcs-offline.zip -Algorithm SHA256).Hash.ToLower()
          Write-Host "SHA256: $h"
          if ($h -ne "d79c012177c8b1701188a90825539466d28cc18dc87b3c62361b4960b315724d") { throw "SHA-256 mismatch" }
          Write-Host "SHA OK, size:" (Get-Item ybcs-offline.zip).Length

      - name: Extract package
        shell: pwsh
        run: |
          Expand-Archive ybcs-offline.zip -DestinationPath ybcs
          Write-Host "--- top level ---"
          Get-ChildItem ybcs | Select-Object Name, Length | Format-Table -AutoSize
          Write-Host "--- launcher cmd files ---"
          Get-ChildItem ybcs -Filter "*.cmd" -Recurse | Select-Object FullName | Format-Table -AutoSize

      - name: Pre-check (no GUI, exit code recorded)
        shell: pwsh
        run: |
          cd ybcs
          $launcher = Get-ChildItem -Filter "*单机游戏.cmd" | Select-Object -First 1
          if (-not $launcher) { $launcher = Get-ChildItem -Filter "*.cmd" | Select-Object -First 1 }
          Write-Host "launcher: $($launcher.Name)"
          cmd /c "`"$($launcher.Name)`" --check --no-pause" 2>&1 | Tee-Object -FilePath ..\precheck.log
          Write-Host "precheck exit code: $LASTEXITCODE"
          if ($LASTEXITCODE -ne 0) { Write-Host "PRECHECK FAILED (exit $LASTEXITCODE) - see precheck.log" }

      - name: Launch game and screenshot
        shell: pwsh
        run: |
          $ws = $env:GITHUB_WORKSPACE
          $shotDir = Join-Path $ws "screenshots"
          New-Item -ItemType Directory -Force -Path $shotDir | Out-Null
          $clientLog = Join-Path $ws "ybcs\runtime\logs\ybcs-gui-client.jsonl"
          $serverLog = Join-Path $ws "ybcs\runtime\logs\ybcs-gui-server.log"
          cd ybcs
          $memoryPattern = 'VirtualAlloc|VirtualProtect|MapViewOfFile|PAGE_READONLY|PAGE_READWRITE|CreateFileMapping|NtAllocateVirtualMemory|NtMapViewOfSection|NtProtectVirtualMemory|mmap|Memory\.protect|Memory\.alloc|Process\.enumerateRanges|0x1a0000'
          $memorySourceRoot = Join-Path $ws "ybcs\src"
          $memorySourceFiles = @(
            (Join-Path $memorySourceRoot "legacy_gui_runtime\ybcs_emulated_launcher.py"),
            (Join-Path $memorySourceRoot "legacy_gui_runtime\ybcs_session_adapter.py"),
            (Join-Path $memorySourceRoot "offline_server\listener.py"),
            (Join-Path $memorySourceRoot "offline_server\session_adapter.py")
          ) + @(Get-ChildItem (Join-Path $memorySourceRoot "offline_server") -Recurse -File -Filter "*.py" | ForEach-Object { $_.FullName })
          foreach ($sourcePath in ($memorySourceFiles | Select-Object -Unique)) {
            if (-not (Test-Path -LiteralPath $sourcePath)) { continue }
            $sourceFile = $sourcePath.Substring($ws.Length + 1)
            $hits = @(Select-String -LiteralPath $sourcePath -Pattern $memoryPattern -AllMatches)
            Write-Host "SOURCE_MEMORY_SCAN path=$sourceFile hit_count=$($hits.Count)"
            foreach ($hit in $hits) {
              Write-Host "SOURCE_MEMORY_HIT path=$sourceFile line=$($hit.LineNumber) text=$($hit.Line.Trim())"
            }
          }
          $neodarkPath = Join-Path $ws "ybcs\runtime\client\NeoDark.exe"
          if (-not (Test-Path -LiteralPath $neodarkPath)) { throw "NeoDark.exe missing from the verified offline package: $neodarkPath" }
          $neoHash = (Get-FileHash -LiteralPath $neodarkPath -Algorithm SHA256).Hash.ToLowerInvariant()
          Write-Host "STATIC_BINARY path=$neodarkPath sha256=$neoHash"
          if ($neoHash -ne "c1be05eb2977a8aae8cbe8b716bc1e3957263edde8187d5269d554b327f13cbd") {
            throw "NeoDark.exe differs from the binary used for the offline static disassembly"
          }
          Write-Host "STATIC_UNPACK UPX_PE32 method=2(NRV2B) filter=0x26 cto=0x1b; compressed/uncompressed Adler-32 checks matched; binary was not executed for static analysis"
          Write-Host "STATIC_DISPATCH_ANALYSIS binary=NeoDark.exe image_base=0x00400000 architecture=PE32"
          Write-Host "STATIC_HIT_TEST 0x004572A0: x_rel=arg0-[this+0x14]; y_rel=arg1-[this+0x18]; rows=[this+0x110..this+0x114] pointer array; row.Kind=[row+0]; active_kind=[this+0x11c]; RECT=[row+0x4]; transform=(dx=+20,dy=-15) via [0x004E2478]; point-in-rect via [0x004E2510]; hit stores ordinal at [this+0x120], no hit stores -1 at 0x004573C2"
          Write-Host "STATIC_ORDINAL_RULE: only rows whose Kind equals [this+0x11c] are eligible; eligible ordinal starts at 0 and increments after each miss; first containing RECT wins"
          Write-Host "STATIC_PROGRAM15_RESOURCE: ordinal0=进行对话 (49 09 dialogue request); ordinal1=购买消耗品 (30 target/action service request); ordinal2=不需要; resource program=15; selectable_count=3"
          Write-Host "STATIC_CLICK_HANDLER 0x004571F0: if [this+0x11c]==2 then push [this+0x120] and call 0x00457A90"
          Write-Host "STATIC_DISPATCH 0x00457A90: ordinal=[esp+0x4]; range 0..3; jump table=[0x00457CB8+ordinal*4]"
          Write-Host "STATIC_ORDINAL0 0x00457ADE: packet=[0x49,0x09,word([this+0x108])] length=4; call target=0x004A6FD0"
          Write-Host "STATIC_ORDINAL1 0x00457B44: packet=[0x30,word([this+0x108]),word(action)] length=5; action selected from ([this+0x104]-12) lookup table; call target=0x004A6FD0"
          Write-Host "STATIC_DISPATCH_TAIL 0x00457CA0: call 0x004186E0 then return; packet dispatcher 0x004A6FD0 has error branches to 0x004D94D1"
          $npcPatch = @'
          from pathlib import Path

          path = Path("src/legacy_gui_runtime/ybcs_emulated_launcher.py")
          original = path.read_bytes()

          old_enter = b'''      onEnter(args) {
                  this.offlineNpcClick = null;
                  const scene = this.context.ecx;
                  const relativePoint = args[0];
                  const target = offlineNpcWorldEntityAt(scene, relativePoint);
                  if (target === null) return;
                  const mapWire = safeS16(ptr(0x004F48B4));
                  const entityId = safeU16(target.add(0xB4));
                  const row = offlineNpcSingleClickRow(mapWire, entityId);
                  if (row === null) return;
                  this.offlineNpcClick = {
                    target: target,
                    row: row,
                    mapWire: mapWire
                  };
                },
          '''
          new_enter = b'''      onEnter(args) {
                  this.offlineNpcClick = null;
                  const scene = this.context.ecx;
                  const relativePoint = args[0];
                  const relativeX = safeDword(relativePoint, true);
                  const relativeY = safeDword(relativePoint.add(4), true);
                  const sceneOffsetX = safeDword(scene.add(0x25C4), true);
                  const sceneOffsetY = safeDword(scene.add(0x25C8), true);
                  let clickedCell = null;
                  if (relativeX !== null && relativeY !== null &&
                      sceneOffsetX !== null && sceneOffsetY !== null) {
                    clickedCell = offlineNpcScreenToCell(
                      relativeX + sceneOffsetX, relativeY + sceneOffsetY
                    );
                  }
                  const target = offlineNpcWorldEntityAt(scene, relativePoint);
                  const mapWire = safeS16(ptr(0x004F48B4));
                  const entityId = target === null ? null : safeU16(target.add(0xB4));
                  const row = target === null
                    ? null
                    : offlineNpcSingleClickRow(mapWire, entityId);
                  emit("offline_npc_single_click_probe", {
                    mapWire: mapWire,
                    relativeX: relativeX,
                    relativeY: relativeY,
                    sceneOffsetX: sceneOffsetX,
                    sceneOffsetY: sceneOffsetY,
                    clickedCell: clickedCell,
                    targetFound: target !== null,
                    targetEntityId: entityId,
                    targetCell: target === null ? null : [
                      safeDword(target.add(0xD4), true),
                      safeDword(target.add(0xD8), true)
                    ],
                    rowFound: row !== null
                  });
                  if (target === null || row === null) return;
                  this.offlineNpcClick = {
                    target: target,
                    row: row,
                    mapWire: mapWire
                  };
                },
          '''

          old_leave = b'''      onLeave() {
                  if (this.offlineNpcClick === null) return;
                  const click = this.offlineNpcClick;
                  const selected = selectedWorldEntity();
                  if (selected === null || !selected.equals(click.target)) return;
                  const self = offlineNpcCurrentSelf();
                  if (self === null || self.equals(selected)) return;
                  const distance = offlineNpcInteractionDistance(self, selected);
                  const accepted = distance !== null &&
                    distance < OFFLINE_NPC_SINGLE_CLICK_DISTANCE;
          '''
          new_leave = b'''      onLeave() {
                  if (this.offlineNpcClick === null) return;
                  const click = this.offlineNpcClick;
                  const nativeSelected = selectedWorldEntity();
                  const nativeSelectionMatches = nativeSelected !== null &&
                    nativeSelected.equals(click.target);
                  const self = offlineNpcCurrentSelf();
                  const distance = self === null || self.equals(click.target)
                    ? null
                    : offlineNpcInteractionDistance(self, click.target);
                  emit("offline_npc_single_click_candidate", {
                    mapWire: click.mapWire,
                    entityId: click.row.entityId,
                    role: click.row.role,
                    nativeSelectedEntityId: nativeSelected === null
                      ? null
                      : safeS16(nativeSelected.add(0xB4)),
                    nativeSelectionMatches: nativeSelectionMatches,
                    sceneSelectedId: safeDword(ptr(0x00A399D8).add(0x800), true),
                    playerCell: self === null ? null : [
                      safeDword(self.add(0xD4), true),
                      safeDword(self.add(0xD8), true)
                    ],
                    targetCell: [
                      safeDword(click.target.add(0xD4), true),
                      safeDword(click.target.add(0xD8), true)
                    ],
                    distance: distance,
                    exclusiveDistanceLimit: OFFLINE_NPC_SINGLE_CLICK_DISTANCE
                  });
                  if (distance === null) return;
                  const accepted = distance < OFFLINE_NPC_SINGLE_CLICK_DISTANCE;
          '''

          if original.count(old_enter) != 1:
              raise SystemExit(f"NPC onEnter anchor count must be 1, got {original.count(old_enter)}")
          if original.count(old_leave) != 1:
              raise SystemExit(f"NPC onLeave anchor count must be 1, got {original.count(old_leave)}")

          patched = original.replace(old_enter, new_enter, 1).replace(old_leave, new_leave, 1)
          compile(patched.decode("utf-8"), str(path), "exec")
          if b"if (selected === null || !selected.equals(click.target)) return;" in patched:
              raise SystemExit("stale selected-world-entity gate remains")
          if b"offlineNpcInteractionDistance(self, click.target)" not in patched:
              raise SystemExit("distance check is not bound to exact clicked NPC")
          if b"queueOfflineNpcSingleClick(" not in patched:
              raise SystemExit("original exact 0x08 sender is missing")
          old_trace_anchor = b'''const offlineNpcSingleClickInstallTimer = setTimeout(
            installOfflineNpcSingleClickInteraction,
            OFFLINE_NPC_SINGLE_CLICK_INSTALL_DELAY_MS
          );
          '''
          new_trace_anchor = b'''          let npcDialogNativeTraceInstalled = false;
          let npcDialogNativeTraceSequence = 0;
          let npcExitTraceInstalled = false;
          function npcDialogTraceHex(bytes) {
            return Array.from(bytes).map(function(value) {
              return (value < 16 ? "0" : "") + value.toString(16);
            }).join("");
          }
          function npcDialogTraceBacktrace(context) {
            try {
              return Thread.backtrace(context, Backtracer.ACCURATE).map(function(address) {
                let symbol = null;
                try { symbol = DebugSymbol.fromAddress(address).toString(); } catch (_) {}
                return {address: address.toString(), symbol: symbol};
              });
            } catch (error) {
              return [{error: String(error)}];
            }
          }
          function npcDialogTraceMemoryRange(value) {
            let addressText = null;
            try {
              const address = ptr(value);
              addressText = address.toString();
              const range = Process.findRangeByAddress(address);
              if (range === null) return {status: "unmapped", address: addressText};
              return {
                status: "mapped",
                address: addressText,
                base: range.base.toString(),
                size: range.size,
                protection: range.protection,
                file: range.file ? {
                  path: range.file.path || null,
                  offset: range.file.offset,
                  size: range.file.size
                } : null
              };
            } catch (error) {
              return {status: "range-query-error", address: addressText, error: String(error)};
            }
          }
          function npcDialogTraceReadProbe(value, length) {
            let addressText = null;
            try {
              const address = ptr(value);
              addressText = address.toString();
              const raw = address.readVolatile(length);
              if (raw === null) return {status: "unreadable", address: addressText, length: length};
              return {
                status: "readable",
                address: addressText,
                length: length,
                hex: npcDialogTraceHex(Array.from(new Uint8Array(raw)))
              };
            } catch (error) {
              return {status: "read-error", address: addressText, error: String(error)};
            }
          }
          let npcMemoryApiTraceInstalled = false;
          let npcMemoryMapSnapshotSequence = 0;
          let npcMemoryMenuSnapshotEmitted = false;
          let npcMemoryDisassemblyEmitted = false;
          const npcMemorySectionMetadata = {};
          const npcMemoryTargetApiCounts = {
            mapView: 0,
            allocate: 0,
            protect: 0
          };
          const NPC_MEMORY_TARGET = 0x001A0000;
          let npcVirtualQuery = null;
          let npcMappedFileName = null;
          let npcMemoryInfoBuffer = null;
          let npcMappedFileBuffer = null;
          function npcDialogTraceMemoryProtectionName(value) {
            const base = value & 0xff;
            const names = {
              0x01: "PAGE_NOACCESS",
              0x02: "PAGE_READONLY",
              0x04: "PAGE_READWRITE",
              0x08: "PAGE_WRITECOPY",
              0x10: "PAGE_EXECUTE",
              0x20: "PAGE_EXECUTE_READ",
              0x40: "PAGE_EXECUTE_READWRITE",
              0x80: "PAGE_EXECUTE_WRITECOPY"
            };
            const flags = [];
            if (names[base]) flags.push(names[base]);
            if (value & 0x100) flags.push("PAGE_GUARD");
            if (value & 0x200) flags.push("PAGE_NOCACHE");
            if (value & 0x400) flags.push("PAGE_WRITECOMBINE");
            return flags.length ? flags.join("|") : "0x" + value.toString(16);
          }
          function npcDialogTraceMemoryTypeName(value) {
            if (value === 0x01000000) return "MEM_IMAGE";
            if (value === 0x00040000) return "MEM_MAPPED";
            if (value === 0x00020000) return "MEM_PRIVATE";
            return "0x" + value.toString(16);
          }
          function npcDialogTraceMemoryStateName(value) {
            if (value === 0x1000) return "MEM_COMMIT";
            if (value === 0x2000) return "MEM_RESERVE";
            if (value === 0x10000) return "MEM_FREE";
            return "0x" + value.toString(16);
          }
          function npcDialogTraceInitVirtualQuery() {
            if (npcVirtualQuery !== null) return true;
            try {
              if (Process.pointerSize !== 4) {
                emit("npc_memory_virtual_query_unavailable", {
                  reason: "NeoDark diagnostic expects PE32 but Process.pointerSize is not 4",
                  pointerSize: Process.pointerSize
                });
                return false;
              }
              const kernel32 = Process.getModuleByName("kernel32.dll");
              const virtualQueryAddress = kernel32.getExportByName("VirtualQuery");
              npcVirtualQuery = new NativeFunction(
                virtualQueryAddress, "uint", ["pointer", "pointer", "uint"]
              );
              npcMemoryInfoBuffer = Memory.alloc(28);
              npcMemoryInfoBuffer.writeByteArray(new Array(28).fill(0));
              try {
                const mappedFileAddress = kernel32.getExportByName("K32GetMappedFileNameW");
                npcMappedFileName = new NativeFunction(
                  mappedFileAddress, "uint", ["pointer", "pointer", "pointer", "uint"]
                );
                npcMappedFileBuffer = Memory.alloc(2048);
              } catch (mappedError) {
                npcMappedFileName = null;
                emit("npc_memory_mapped_file_api_unavailable", String(mappedError));
              }
              emit("npc_memory_virtual_query_ready", {
                api: virtualQueryAddress.toString(),
                pointerSize: Process.pointerSize,
                mbiSize: 28,
                mappedFileApi: npcMappedFileName !== null
              });
              return true;
            } catch (error) {
              emit("npc_memory_virtual_query_init_error", String(error));
              return false;
            }
          }
          function npcDialogTraceMappedFilePath(address) {
            if (npcMappedFileName === null || npcMappedFileBuffer === null) return null;
            try {
              npcMappedFileBuffer.writeByteArray(new Array(2048).fill(0));
              const length = npcMappedFileName(
                ptr(0xffffffff), ptr(address), npcMappedFileBuffer, 1024
              );
              return length > 0 ? npcMappedFileBuffer.readUtf16String() : null;
            } catch (error) {
              return "query-error: " + String(error);
            }
          }
          function npcDialogTraceQueryMemoryRegion(value) {
            let addressText = null;
            try {
              if (!npcDialogTraceInitVirtualQuery()) return {status: "virtual-query-unavailable"};
              const address = ptr(value);
              addressText = address.toString();
              const returned = npcVirtualQuery(address, npcMemoryInfoBuffer, 28);
              if (returned === 0) return {status: "VirtualQuery-returned-zero", address: addressText};
              const base = npcMemoryInfoBuffer.readU32();
              const allocationBase = npcMemoryInfoBuffer.add(4).readU32();
              const allocationProtect = npcMemoryInfoBuffer.add(8).readU32();
              const regionSize = npcMemoryInfoBuffer.add(12).readU32();
              const state = npcMemoryInfoBuffer.add(16).readU32();
              const protect = npcMemoryInfoBuffer.add(20).readU32();
              const type = npcMemoryInfoBuffer.add(24).readU32();
              const range = Process.findRangeByAddress(address);
              const module = Process.findModuleByAddress(address);
              const rangeFile = range && range.file ? {
                path: range.file.path || null,
                offset: range.file.offset,
                size: range.file.size
              } : null;
              return {
                status: "queried",
                address: addressText,
                base: "0x" + base.toString(16),
                allocationBase: "0x" + allocationBase.toString(16),
                allocationProtect: "0x" + allocationProtect.toString(16),
                allocationProtectName: npcDialogTraceMemoryProtectionName(allocationProtect),
                regionSize: regionSize,
                state: "0x" + state.toString(16),
                stateName: npcDialogTraceMemoryStateName(state),
                protect: "0x" + protect.toString(16),
                protectName: npcDialogTraceMemoryProtectionName(protect),
                type: "0x" + type.toString(16),
                typeName: npcDialogTraceMemoryTypeName(type),
                mappedFilePath: npcDialogTraceMappedFilePath(address),
                fridaRange: range ? {
                  base: range.base.toString(),
                  size: range.size,
                  protection: range.protection,
                  file: rangeFile
                } : null,
                module: module ? {
                  name: module.name,
                  base: module.base.toString(),
                  size: module.size,
                  path: module.path
                } : null
              };
            } catch (error) {
              return {status: "query-error", address: addressText, error: String(error)};
            }
          }
          function npcDialogTraceEmitMemoryMapSnapshot(phase) {
            try {
              if (!npcDialogTraceInitVirtualQuery()) return;
              const records = [];
              const counts = {
                MEM_FREE: 0,
                MEM_RESERVE: 0,
                MEM_COMMIT: 0,
                MEM_IMAGE: 0,
                MEM_MAPPED: 0,
                MEM_PRIVATE: 0
              };
              let current = 0;
              let endAddress = 0;
              let stoppedReason = "address-space-end";
              let skippedLowAddress = false;
              for (let index = 0; index < 20000 && current < 0x80000000; index++) {
                const returned = npcVirtualQuery(ptr(current), npcMemoryInfoBuffer, 28);
                if (returned === 0) {
                  if (current === 0 && records.length === 0) {
                    current = 0x10000;
                    skippedLowAddress = true;
                    continue;
                  }
                  stoppedReason = "VirtualQuery-returned-zero-at-0x" + current.toString(16);
                  break;
                }
                const base = npcMemoryInfoBuffer.readU32();
                const allocationBase = npcMemoryInfoBuffer.add(4).readU32();
                const allocationProtect = npcMemoryInfoBuffer.add(8).readU32();
                const regionSize = npcMemoryInfoBuffer.add(12).readU32();
                const state = npcMemoryInfoBuffer.add(16).readU32();
                const protect = npcMemoryInfoBuffer.add(20).readU32();
                const type = npcMemoryInfoBuffer.add(24).readU32();
                if (regionSize === 0) {
                  stoppedReason = "zero-region-size-at-0x" + current.toString(16);
                  break;
                }
                const record = {
                  base: "0x" + base.toString(16),
                  allocationBase: "0x" + allocationBase.toString(16),
                  allocationProtect: "0x" + allocationProtect.toString(16),
                  regionSize: regionSize,
                  state: "0x" + state.toString(16),
                  stateName: npcDialogTraceMemoryStateName(state),
                  protect: "0x" + protect.toString(16),
                  protectName: npcDialogTraceMemoryProtectionName(protect),
                  type: "0x" + type.toString(16),
                  typeName: npcDialogTraceMemoryTypeName(type)
                };
                records.push(record);
                if (record.stateName === "MEM_FREE") counts.MEM_FREE++;
                else if (record.stateName === "MEM_RESERVE") counts.MEM_RESERVE++;
                else if (record.stateName === "MEM_COMMIT") counts.MEM_COMMIT++;
                if (record.typeName === "MEM_IMAGE") counts.MEM_IMAGE++;
                else if (record.typeName === "MEM_MAPPED") counts.MEM_MAPPED++;
                else if (record.typeName === "MEM_PRIVATE") counts.MEM_PRIVATE++;
                const next = base + regionSize;
                if (next <= current) {
                  stoppedReason = "non-advancing-region-at-0x" + current.toString(16);
                  break;
                }
                current = next;
                endAddress = current;
              }
              const sequence = ++npcMemoryMapSnapshotSequence;
              const target = npcDialogTraceQueryMemoryRegion(ptr(NPC_MEMORY_TARGET));
              const targetBytes = npcDialogTraceReadProbe(ptr(NPC_MEMORY_TARGET), 64);
              const chunkSize = 64;
              const chunkCount = Math.ceil(records.length / chunkSize);
              emit("npc_process_memory_map_snapshot_begin", {
                phase: phase,
                sequence: sequence,
                pointerSize: Process.pointerSize,
                startAddress: "0x0",
                endAddress: "0x" + endAddress.toString(16),
                regionCount: records.length,
                chunkCount: chunkCount,
                skippedLowAddress: skippedLowAddress
              });
              for (let chunk = 0; chunk < chunkCount; chunk++) {
                emit("npc_process_memory_map_snapshot_chunk", {
                  phase: phase,
                  sequence: sequence,
                  chunk: chunk,
                  chunkCount: chunkCount,
                  regions: records.slice(chunk * chunkSize, (chunk + 1) * chunkSize)
                });
              }
              emit("npc_process_memory_map_snapshot_end", {
                phase: phase,
                sequence: sequence,
                regionCount: records.length,
                endAddress: "0x" + endAddress.toString(16),
                stoppedReason: stoppedReason,
                stateRegionCounts: {
                  free: counts.MEM_FREE,
                  reserve: counts.MEM_RESERVE,
                  commit: counts.MEM_COMMIT
                },
                typeRegionCounts: {
                  image: counts.MEM_IMAGE,
                  mapped: counts.MEM_MAPPED,
                  private: counts.MEM_PRIVATE
                },
                targetRegion: target,
                targetFirst64Bytes: targetBytes,
                targetMappingApiEventsSinceHookInstall: npcMemoryTargetApiCounts
              });
            } catch (error) {
              emit("npc_process_memory_map_snapshot_error", {
                phase: phase,
                error: String(error)
              });
            }
          }
          function npcDialogTraceRangeContainsTarget(base, size) {
            try {
              const start = ptr(base).toUInt32();
              return size > 0 && start <= NPC_MEMORY_TARGET &&
                NPC_MEMORY_TARGET < start + size;
            } catch (_) {
              return false;
            }
          }
          function npcDialogTraceProbeActivationContext(phase) {
            const result = {
              phase: phase,
              target: "0x001A0000",
              signature: null,
              peb: null,
              pebPointerReferences: [],
              currentThreadId: Process.getCurrentThreadId(),
              currentActCtx: null,
              currentActCtxPointerReferences: [],
              errors: []
            };
            try {
              const targetBytes = ptr(NPC_MEMORY_TARGET).readVolatile(32);
              const targetView = new DataView(targetBytes);
              const magic = targetView.getUint32(0, true);
              result.signature = {
                magic: "0x" + magic.toString(16),
