name: ybcs-offline-verify

on:
  push:
    branches: [ybcs-verify]
    paths: ['.github/workflows/ybcs-verify.yml']
  workflow_dispatch:

jobs:
  verify:
    runs-on: windows-latest
    timeout-minutes: 120
    steps:
      - name: Download ybcs-offline.zip (public Drive link)
        shell: pwsh
        run: |
          pip install gdown
          gdown "https://drive.google.com/uc?export=download&id=1qNOt9-aMiN8dZsh2FOlT5rhltZCyeFvt" -O ybcs-offline.zip
          $h = (Get-FileHash ybcs-offline.zip -Algorithm SHA256).Hash.ToLower()
          Write-Host "SHA256: $h"
          if ($h -ne "d79c012177c8b1701188a90825539466d28cc18dc87b3c62361b4960b315724d") { throw "SHA-256 mismatch" }
          Write-Host "SHA OK, size:" (Get-Item ybcs-offline.zip).Length

      - name: Extract package
        shell: pwsh
        run: |
          Expand-Archive ybcs-offline.zip -DestinationPath ybcs
          Write-Host "--- top level ---"
          Get-ChildItem ybcs | Select-Object Name, Length | Format-Table -AutoSize
          Write-Host "--- launcher cmd files ---"
          Get-ChildItem ybcs -Filter "*.cmd" -Recurse | Select-Object FullName | Format-Table -AutoSize

      - name: Pre-check (no GUI, exit code recorded)
        shell: pwsh
        run: |
          cd ybcs
          $launcher = Get-ChildItem -Filter "*单机游戏.cmd" | Select-Object -First 1
          if (-not $launcher) { $launcher = Get-ChildItem -Filter "*.cmd" | Select-Object -First 1 }
          Write-Host "launcher: $($launcher.Name)"
          cmd /c "`"$($launcher.Name)`" --check --no-pause" 2>&1 | Tee-Object -FilePath ..\precheck.log
          Write-Host "precheck exit code: $LASTEXITCODE"
          if ($LASTEXITCODE -ne 0) { Write-Host "PRECHECK FAILED (exit $LASTEXITCODE) - see precheck.log" }

      - name: Launch game and screenshot
        shell: pwsh
        run: |
          $ws = $env:GITHUB_WORKSPACE
          $shotDir = Join-Path $ws "screenshots"
          New-Item -ItemType Directory -Force -Path $shotDir | Out-Null
          $clientLog = Join-Path $ws "ybcs\runtime\logs\ybcs-gui-client.jsonl"
          $serverLog = Join-Path $ws "ybcs\runtime\logs\ybcs-gui-server.log"
          cd ybcs
          $npcPatch = @'
          from pathlib import Path

          path = Path("src/legacy_gui_runtime/ybcs_emulated_launcher.py")
          original = path.read_bytes()

          old_enter = b'''      onEnter(args) {
                  this.offlineNpcClick = null;
                  const scene = this.context.ecx;
                  const relativePoint = args[0];
                  const target = offlineNpcWorldEntityAt(scene, relativePoint);
                  if (target === null) return;
                  const mapWire = safeS16(ptr(0x004F48B4));
                  const entityId = safeU16(target.add(0xB4));
                  const row = offlineNpcSingleClickRow(mapWire, entityId);
                  if (row === null) return;
                  this.offlineNpcClick = {
                    target: target,
                    row: row,
                    mapWire: mapWire
                  };
                },
          '''
          new_enter = b'''      onEnter(args) {
                  this.offlineNpcClick = null;
                  const scene = this.context.ecx;
                  const relativePoint = args[0];
                  const relativeX = safeDword(relativePoint, true);
                  const relativeY = safeDword(relativePoint.add(4), true);
                  const sceneOffsetX = safeDword(scene.add(0x25C4), true);
                  const sceneOffsetY = safeDword(scene.add(0x25C8), true);
                  let clickedCell = null;
                  if (relativeX !== null && relativeY !== null &&
                      sceneOffsetX !== null && sceneOffsetY !== null) {
                    clickedCell = offlineNpcScreenToCell(
                      relativeX + sceneOffsetX, relativeY + sceneOffsetY
                    );
                  }
                  const target = offlineNpcWorldEntityAt(scene, relativePoint);
                  const mapWire = safeS16(ptr(0x004F48B4));
                  const entityId = target === null ? null : safeU16(target.add(0xB4));
                  const row = target === null
                    ? null
                    : offlineNpcSingleClickRow(mapWire, entityId);
                  emit("offline_npc_single_click_probe", {
                    mapWire: mapWire,
                    relativeX: relativeX,
                    relativeY: relativeY,
                    sceneOffsetX: sceneOffsetX,
                    sceneOffsetY: sceneOffsetY,
                    clickedCell: clickedCell,
                    targetFound: target !== null,
                    targetEntityId: entityId,
                    targetCell: target === null ? null : [
                      safeDword(target.add(0xD4), true),
                      safeDword(target.add(0xD8), true)
                    ],
                    rowFound: row !== null
                  });
                  if (target === null || row === null) return;
                  this.offlineNpcClick = {
                    target: target,
                    row: row,
                    mapWire: mapWire
                  };
                },
          '''

          old_leave = b'''      onLeave() {
                  if (this.offlineNpcClick === null) return;
                  const click = this.offlineNpcClick;
                  const selected = selectedWorldEntity();
                  if (selected === null || !selected.equals(click.target)) return;
                  const self = offlineNpcCurrentSelf();
                  if (self === null || self.equals(selected)) return;
                  const distance = offlineNpcInteractionDistance(self, selected);
                  const accepted = distance !== null &&
                    distance < OFFLINE_NPC_SINGLE_CLICK_DISTANCE;
          '''
          new_leave = b'''      onLeave() {
                  if (this.offlineNpcClick === null) return;
                  const click = this.offlineNpcClick;
                  const nativeSelected = selectedWorldEntity();
                  const nativeSelectionMatches = nativeSelected !== null &&
                    nativeSelected.equals(click.target);
                  const self = offlineNpcCurrentSelf();
                  const distance = self === null || self.equals(click.target)
                    ? null
                    : offlineNpcInteractionDistance(self, click.target);
                  emit("offline_npc_single_click_candidate", {
                    mapWire: click.mapWire,
                    entityId: click.row.entityId,
                    role: click.row.role,
                    nativeSelectedEntityId: nativeSelected === null
                      ? null
                      : safeS16(nativeSelected.add(0xB4)),
                    nativeSelectionMatches: nativeSelectionMatches,
                    sceneSelectedId: safeDword(ptr(0x00A399D8).add(0x800), true),
                    playerCell: self === null ? null : [
                      safeDword(self.add(0xD4), true),
                      safeDword(self.add(0xD8), true)
                    ],
                    targetCell: [
                      safeDword(click.target.add(0xD4), true),
                      safeDword(click.target.add(0xD8), true)
                    ],
                    distance: distance,
                    exclusiveDistanceLimit: OFFLINE_NPC_SINGLE_CLICK_DISTANCE
                  });
                  if (distance === null) return;
                  const accepted = distance < OFFLINE_NPC_SINGLE_CLICK_DISTANCE;
          '''

          if original.count(old_enter) != 1:
              raise SystemExit(f"NPC onEnter anchor count must be 1, got {original.count(old_enter)}")
          if original.count(old_leave) != 1:
              raise SystemExit(f"NPC onLeave anchor count must be 1, got {original.count(old_leave)}")

          patched = original.replace(old_enter, new_enter, 1).replace(old_leave, new_leave, 1)
          compile(patched.decode("utf-8"), str(path), "exec")
          if b"if (selected === null || !selected.equals(click.target)) return;" in patched:
              raise SystemExit("stale selected-world-entity gate remains")
          if b"offlineNpcInteractionDistance(self, click.target)" not in patched:
              raise SystemExit("distance check is not bound to exact clicked NPC")
          if b"queueOfflineNpcSingleClick(" not in patched:
              raise SystemExit("original exact 0x08 sender is missing")
          old_trace_anchor = b'''const offlineNpcSingleClickInstallTimer = setTimeout(
            installOfflineNpcSingleClickInteraction,
            OFFLINE_NPC_SINGLE_CLICK_INSTALL_DELAY_MS
          );
          '''
          new_trace_anchor = b'''let npcDialogNativeTraceInstalled = false;
          let npcDialogNativeTraceSequence = 0;
          function npcDialogTraceHex(bytes) {
            return Array.from(bytes).map(function(value) {
              return (value < 16 ? "0" : "") + value.toString(16);
            }).join("");
          }
          function npcDialogTraceReadS16(bytes, offset) {
            const value = bytes[offset] | (bytes[offset + 1] << 8);
            return (value & 0x8000) !== 0 ? value - 0x10000 : value;
          }
          function npcDialogTracePointer(value) {
            try {
              const address = ptr(value);
              if (address.isNull() || address.toUInt32() < 0x10000) return null;
              const range = Process.findRangeByAddress(address);
              if (range === null || range.protection.indexOf("r") < 0) return null;
              const available = range.base.add(range.size).sub(address).toInt32();
              if (available < 8) return null;
              const length = Math.min(48, available);
              const raw = Memory.readByteArray(address, length);
              const bytes = Array.from(new Uint8Array(raw));
              const rowCandidate = bytes.length >= 9 ? {
                kind: bytes[0],
                x: npcDialogTraceReadS16(bytes, 1),
                y: npcDialogTraceReadS16(bytes, 3),
                width: npcDialogTraceReadS16(bytes, 5),
                height: npcDialogTraceReadS16(bytes, 7)
              } : null;
              return {
                address: address.toString(),
                bytesHex: npcDialogTraceHex(bytes),
                rowCandidate: rowCandidate
              };
            } catch (_) {
              return null;
            }
          }
          function npcDialogTraceSnapshot(name, address, args, context) {
            const registers = {};
            const candidateWords = [];
            ["eax", "ebx", "ecx", "edx", "esi", "edi", "ebp", "esp", "eip"].forEach(function(registerName) {
              try {
                const value = context[registerName].toUInt32();
                registers[registerName] = "0x" + value.toString(16);
                if (value <= 0xffff) candidateWords.push({source: "reg." + registerName, value: value});
              } catch (_) {}
            });
            const argumentWords = [];
            const pointerSnapshots = [];
            for (let index = 0; index < 6; index++) {
              try {
                const value = args[index].toUInt32();
                argumentWords.push({index: index, value: value, hex: "0x" + value.toString(16)});
                if (value <= 0xffff) candidateWords.push({source: "arg" + index, value: value});
                const snapshot = npcDialogTracePointer(ptr(value));
                if (snapshot !== null) pointerSnapshots.push({source: "arg" + index, snapshot: snapshot});
              } catch (_) {}
            }
            const stackWords = [];
            try {
              const esp = context.esp;
              for (let index = 0; index < 12; index++) {
                const value = esp.add(index * 4).readU32();
                stackWords.push({index: index, value: value, hex: "0x" + value.toString(16)});
                if (value <= 0xffff) candidateWords.push({source: "stack" + index, value: value});
                if (index < 8) {
                  const snapshot = npcDialogTracePointer(ptr(value));
                  if (snapshot !== null) pointerSnapshots.push({source: "stack" + index, snapshot: snapshot});
                }
              }
            } catch (_) {}
            const programIndexCandidates = candidateWords.filter(function(item) {
              return item.value >= 11 && item.value <= 49;
            });
            const optionOrdinalCandidates = candidateWords.filter(function(item) {
              return item.value >= 0 && item.value <= 3;
            });
            const kindCandidates = pointerSnapshots.filter(function(item) {
              const row = item.snapshot.rowCandidate;
              return row !== null && (row.kind === 1 || row.kind === 2);
            }).map(function(item) {
              return {source: item.source, address: item.snapshot.address, row: item.snapshot.rowCandidate};
            });
            return {
              function: name,
              address: address,
              registers: registers,
              args: argumentWords,
              stack: stackWords,
              programIndexCandidates: programIndexCandidates,
              optionOrdinalCandidates: optionOrdinalCandidates,
              npcScriptKindRowCandidates: kindCandidates,
              pointerSnapshots: pointerSnapshots
            };
          }
          function installNpcDialogNativeTrace() {
            if (npcDialogNativeTraceInstalled) return;
            const targets = [
              {address: 0x00457A90, name: "npc_menu_dispatch_0x00457A90"},
              {address: 0x00457DE0, name: "npc_dialog_resource_0x00457DE0"},
              {address: 0x00457ADE, name: "npc_menu_ordinal0_callsite_0x00457ADE"},
              {address: 0x00457B44, name: "npc_menu_ordinal1_callsite_0x00457B44"}
            ];
            const installed = [];
            const errors = [];
            targets.forEach(function(target) {
              try {
                attachOnce("npc-dialog-native-trace:" + target.name, ptr(target.address), {
                  onEnter(args) {
                    const count = (npcDialogNativeTraceSequence += 1);
                    this.npcDialogTrace = npcDialogTraceSnapshot(
                      target.name, ptr(target.address).toString(), args, this.context
                    );
                    this.npcDialogTrace.sequence = count;
                    emit("npc_dialog_native_call_enter", this.npcDialogTrace);
                  },
                  onLeave(retval) {
                    emit("npc_dialog_native_call_return", {
                      function: target.name,
                      address: ptr(target.address).toString(),
                      sequence: this.npcDialogTrace ? this.npcDialogTrace.sequence : null,
                      returnValue: retval.toString(),
                      returnU32: retval.toUInt32()
                    });
                  }
                });
                installed.push({name: target.name, address: ptr(target.address).toString()});
              } catch (error) {
                errors.push({name: target.name, address: ptr(target.address).toString(), error: String(error)});
              }
            });
            npcDialogNativeTraceInstalled = installed.some(function(item) {
              return item.name === "npc_menu_dispatch_0x00457A90";
            });
            emit("npc_dialog_native_trace_installed", {
              installed: installed,
              errors: errors,
              programIndexRange: [11, 49],
              optionOrdinalRange: [0, 3],
              kindValues: [1, 2],
              snapshotBytesPerPointer: 48
            });
          }
          const npcDialogNativeTraceInstallTimer = setTimeout(
            installNpcDialogNativeTrace,
            5000
          );
          const offlineNpcSingleClickInstallTimer = setTimeout(
            installOfflineNpcSingleClickInteraction,
            OFFLINE_NPC_SINGLE_CLICK_INSTALL_DELAY_MS
          );
          '''
          if patched.count(old_trace_anchor) != 1:
              raise SystemExit(f"NPC native trace insertion anchor count must be 1, got {patched.count(old_trace_anchor)}")
          patched = patched.replace(old_trace_anchor, new_trace_anchor, 1)
          compile(patched.decode("utf-8"), str(path), "exec")
          path.write_bytes(patched)
          print(f"NPC interaction hook patched: {path}; {len(original)} -> {len(patched)} bytes")
          print("Added click-cell/target probe and native-selection diagnostic; exact 0x08 sender and <9 range gate retained.")
          '@
          $npcPatch | python -
          if ($LASTEXITCODE -ne 0) { throw "NPC interaction source patch failed" }
          $launcher = Get-ChildItem -Filter "*单机游戏.cmd" | Select-Object -First 1
          if (-not $launcher) { $launcher = Get-ChildItem -Filter "*.cmd" | Select-Object -First 1 }
          Add-Type -AssemblyName System.Drawing
          Add-Type -AssemblyName System.Windows.Forms
          Add-Type @"
          using System;
          using System.Runtime.InteropServices;
          using System.Threading;
          public static class WinInput {
            [StructLayout(LayoutKind.Sequential)]
            public struct POINT { public int X; public int Y; }
            [StructLayout(LayoutKind.Sequential)]
            public struct RECT { public int Left; public int Top; public int Right; public int Bottom; }
            [DllImport("user32.dll")] public static extern bool SetCursorPos(int X, int Y);
            [DllImport("user32.dll")] public static extern void mouse_event(uint dwFlags, uint dx, uint dy, uint dwData, UIntPtr dwExtraInfo);
            [DllImport("user32.dll")] public static extern void keybd_event(byte bVk, byte bScan, uint dwFlags, UIntPtr dwExtraInfo);
            [DllImport("user32.dll")] public static extern bool SetForegroundWindow(IntPtr hWnd);
            [DllImport("user32.dll")] public static extern bool ClientToScreen(IntPtr hWnd, ref POINT point);
            [DllImport("user32.dll")] public static extern bool GetClientRect(IntPtr hWnd, out RECT rect);
            [UnmanagedFunctionPointer(CallingConvention.StdCall)]
            public delegate bool EnumWindowsProc(IntPtr hWnd, IntPtr lParam);
            [DllImport("user32.dll")] public static extern bool EnumWindows(EnumWindowsProc callback, IntPtr lParam);
            [DllImport("user32.dll")] public static extern uint GetWindowThreadProcessId(IntPtr hWnd, out uint processId);
            [DllImport("user32.dll")] public static extern bool IsWindowVisible(IntPtr hWnd);
            public static IntPtr FindVisibleWindowForProcess(int pid) {
              IntPtr found = IntPtr.Zero;
              EnumWindowsProc callback = delegate(IntPtr hWnd, IntPtr lParam) {
                uint ownerPid;
                GetWindowThreadProcessId(hWnd, out ownerPid);
                if (ownerPid == (uint)pid && IsWindowVisible(hWnd)) {
                  found = hWnd;
                  return false;
                }
                return true;
              };
              EnumWindows(callback, IntPtr.Zero);
              GC.KeepAlive(callback);
              return found;
            }
            public static int[] GetClientSize(IntPtr hwnd) {
              RECT rect;
              if (!GetClientRect(hwnd, out rect)) return new int[] { 0, 0 };
              return new int[] { rect.Right - rect.Left, rect.Bottom - rect.Top };
            }
            public const uint LEFTDOWN = 0x0002;
            public const uint LEFTUP = 0x0004;
            public const uint KEYUP = 0x0002;
            public static void PressKey(byte key) {
              keybd_event(key, 0, 0, UIntPtr.Zero);
              Thread.Sleep(90);
              keybd_event(key, 0, KEYUP, UIntPtr.Zero);
              Thread.Sleep(90);
            }
            public static bool ClickLogicalClient(IntPtr hwnd, int x, int y) {
              RECT rect;
              if (!GetClientRect(hwnd, out rect)) return false;
              int width = rect.Right - rect.Left;
              int height = rect.Bottom - rect.Top;
              if (width <= 0 || height <= 0) return false;
              POINT point = new POINT();
              point.X = (int)Math.Round((double)x * width / 800.0);
              point.Y = (int)Math.Round((double)y * height / 600.0);
              if (!ClientToScreen(hwnd, ref point)) return false;
              if (!SetCursorPos(point.X, point.Y)) return false;
              mouse_event(LEFTDOWN, 0, 0, 0, UIntPtr.Zero);
              Thread.Sleep(120);
              mouse_event(LEFTUP, 0, 0, 0, UIntPtr.Zero);
              return true;
            }
            public static bool ClickScreen(int x, int y) {
              if (!SetCursorPos(x, y)) return false;
              mouse_event(LEFTDOWN, 0, 0, 0, UIntPtr.Zero);
              Thread.Sleep(120);
              mouse_event(LEFTUP, 0, 0, 0, UIntPtr.Zero);
              return true;
            }
          }
          "@
          function Shot($name) {
            $b = [System.Windows.Forms.Screen]::PrimaryScreen.Bounds
            $bmp = New-Object System.Drawing.Bitmap($b.Width, $b.Height)
            $g = [System.Drawing.Graphics]::FromImage($bmp)
            $g.CopyFromScreen($b.Location, [System.Drawing.Point]::Empty, $b.Size)
            $bmp.Save((Join-Path $shotDir "$name.png"))
            $g.Dispose(); $bmp.Dispose()
            Write-Host "shot: $name"
          }
          function Get-LogLineCount([string]$logPath) {
            if (-not (Test-Path -LiteralPath $logPath)) { return 0 }
            $rows = @(Get-Content -LiteralPath $logPath -ErrorAction SilentlyContinue)
            return $rows.Count
          }
          function Wait-LogLine([string]$logPath, [string]$pattern, [int]$afterLine, [int]$timeoutSeconds) {
            $deadline = [DateTime]::UtcNow.AddSeconds($timeoutSeconds)
            while ([DateTime]::UtcNow -lt $deadline) {
              if (Test-Path -LiteralPath $logPath) {
                $rows = @(Get-Content -LiteralPath $logPath -ErrorAction SilentlyContinue)
                if ($rows.Count -gt $afterLine) {
                  for ($j = $afterLine; $j -lt $rows.Count; $j++) {
                    if ($rows[$j] -match $pattern) { return $rows[$j] }
                  }
                }
              }
              Start-Sleep -Seconds 1
            }
            return $null
          }
          function Focus-Game {
            [WinInput]::SetForegroundWindow($gameHwnd) | Out-Null
            Start-Sleep -Milliseconds 150
          }
          function Click-Client([int]$x, [int]$y) {
            Focus-Game
            if (-not [WinInput]::ClickLogicalClient($gameHwnd, $x, $y)) {
              throw "Client click failed at logical ($x,$y)"
            }
            Start-Sleep -Milliseconds 250
          }
          function Click-Screen([int]$x, [int]$y) {
            Focus-Game
            if (-not [WinInput]::ClickScreen($x, $y)) {
              throw "Screen click failed at absolute ($x,$y)"
            }
            Start-Sleep -Milliseconds 250
          }
          function Open-FullMap([int]$expectedMap) {
            $before = Get-LogLineCount $clientLog
            Focus-Game
            [WinInput]::PressKey(0x4D)
            $opened = Wait-LogLine $clientLog 'windowed_full_map_open' $before 20
            if (-not $opened) { throw "M key did not open full map $expectedMap" }
            $event = $opened | ConvertFrom-Json
            if ([int]$event.value.mapWire -ne $expectedMap) {
              throw "Full map opened on map $($event.value.mapWire), expected $expectedMap"
            }
            if (-not [bool]$event.value.ready) {
              $readyAfter = Get-LogLineCount $clientLog
              $ready = Wait-LogLine $clientLog 'windowed_full_map_ready' $readyAfter 30
              if (-not $ready) { throw "Full map bitmap did not become ready for map $expectedMap" }
            }
            Write-Host "full map open: map=$expectedMap ready=$($event.value.ready)"
          }
          function Navigate-MapTarget([int]$mapId, [int]$targetX, [int]$targetY, [int]$clickX, [int]$clickY, [string]$shotName, [string]$nextMap) {
            Open-FullMap $mapId
            Shot "$shotName-fullmap"
            $clientBefore = Get-LogLineCount $clientLog
            $serverBefore = Get-LogLineCount $serverLog
            Write-Host "route target: map=$mapId cell=($targetX,$targetY) fullmap_click=($clickX,$clickY)"
            Click-Client $clickX $clickY
            $started = Wait-LogLine $clientLog 'windowed_full_map_navigation_start' $clientBefore 20
            if (-not $started) { throw "A-star navigation did not start on map $mapId for ($targetX,$targetY)" }
            if ($nextMap -ne "") {
              $routePattern = 'offline_scene_route_arrival.*target=' + [regex]::Escape("map:old:$nextMap")
              $arrived = Wait-LogLine $serverLog $routePattern $serverBefore 240
              if (-not $arrived) {
                $complete = Wait-LogLine $clientLog 'windowed_full_map_navigation_complete' $clientBefore 2
                if ($complete) {
                  throw "Navigation completed on map $mapId but server did not report transition to $nextMap; inspect door trigger cell"
                }
                throw "Timed out waiting for map $mapId to transition to $nextMap"
              }
              Write-Host "scene route confirmed: $arrived"
              Start-Sleep -Seconds 5
              Shot "$shotName-arrived-$nextMap"
            } else {
              $complete = Wait-LogLine $clientLog 'windowed_full_map_navigation_complete' $clientBefore 240
              if (-not $complete) { throw "A-star navigation did not complete on map $mapId at ($targetX,$targetY)" }
              Write-Host "navigation complete: $complete"
              Shot "$shotName-arrived"
            }
          }
          function Wait-ShopPurchase([int]$itemId, [int]$afterLine) {
            $pattern = 'offline_shop_purchase.*accepted=True.*record=\(' + $itemId + ',\s*30,\s*0,\s*0,\s*0\).*selected_count=30'
            return Wait-LogLine $serverLog $pattern $afterLine 45
          }
          function Get-DialogMenuDiff([string]$beforePath, [string]$afterPath) {
            $before = [System.Drawing.Bitmap]::FromFile($beforePath)
            $after = [System.Drawing.Bitmap]::FromFile($afterPath)
            try {
              if ($before.Width -lt 562 -or $after.Width -lt 562 -or
                  $before.Height -lt 604 -or $after.Height -lt 604) {
                throw "NPC dialog screenshot dimensions are smaller than the measured 1024x768 layout"
              }
              $regions = @(
                @{ name = "greeting"; left = 361; top = 555; width = 200; height = 12 },
                @{ name = "option1"; left = 361; top = 573; width = 200; height = 12 },
                @{ name = "option2"; left = 361; top = 591; width = 200; height = 12 }
              )
              $counts = @{}
              foreach ($region in $regions) {
                $changed = 0
                for ($y = $region.top; $y -lt ($region.top + $region.height); $y++) {
                  for ($x = $region.left; $x -lt ($region.left + $region.width); $x++) {
                    $a = $before.GetPixel($x, $y)
                    $b = $after.GetPixel($x, $y)
                    $delta = [Math]::Abs([int]$a.R - [int]$b.R) +
                      [Math]::Abs([int]$a.G - [int]$b.G) +
                      [Math]::Abs([int]$a.B - [int]$b.B)
                    if ($delta -ge 80) { $changed++ }
                  }
                }
                $counts[$region.name] = $changed
              }
              return [pscustomobject]@{
                greeting = [int]$counts["greeting"]
                option1 = [int]$counts["option1"]
                option2 = [int]$counts["option2"]
              }
            }
            finally {
              $before.Dispose()
              $after.Dispose()
            }
          }

          $failureReason = $null
          $p = Start-Process -FilePath "cmd.exe" -ArgumentList "/c `"$($launcher.Name)`"" -WorkingDirectory (Get-Location) -PassThru -RedirectStandardOutput (Join-Path $ws "game-stdout.log") -RedirectStandardError (Join-Path $ws "game-stderr.log")
          Write-Host "launcher pid: $($p.Id)"
          Start-Sleep -Seconds 35

          try {
            $game = $null
            for ($attempt = 0; $attempt -lt 30 -and -not $game; $attempt++) {
              $game = Get-Process -Name NeoDark -ErrorAction SilentlyContinue | Select-Object -First 1
              if (-not $game) { Start-Sleep -Seconds 1 }
            }
            if (-not $game) { throw "NeoDark process was not found" }
            $gameHwnd = [WinInput]::FindVisibleWindowForProcess([int]$game.Id)
            if ($gameHwnd -eq [IntPtr]::Zero) { throw "No visible top-level NeoDark window found by PID $($game.Id)" }
            $clientSize = [WinInput]::GetClientSize($gameHwnd)
            if ($clientSize[0] -le 0 -or $clientSize[1] -le 0) { throw "NeoDark window has an invalid client size" }
            Write-Host "game window: pid=$($game.Id) hwnd=$gameHwnd client=$($clientSize[0])x$($clientSize[1])"
            Focus-Game
            Shot "shot-00-preclick"
            Click-Screen 625 544
            Write-Host "clicked Confirm at 625,544"
            Start-Sleep -Seconds 5
            Shot "shot-00-postclick"
            Focus-Game
            Shot "route-1030-start"
            Navigate-MapTarget 1030 6 138 122 534 "route-1030" "1020"
            Navigate-MapTarget 1020 7 177 148 270 "route-1020" "1000"
            Navigate-MapTarget 1000 28 116 225 226 "route-1000" "2300"
            Navigate-MapTarget 2300 26 34 449 314 "route-2300" ""

            Shot "route-2300-before-npc"
            $menuBefore = Get-LogLineCount $serverLog
            Write-Host "NPC interaction: map=2300 entity=21230 cell=(34,34) player_stand=(26,34) click_client=(656,300)"
            Click-Client 656 300
            $menuOpened = Wait-LogLine $serverLog 'offline_native_npc_menu_opened.*entity=21230.*program=15' $menuBefore 20
            if (-not $menuOpened) { throw "Click at NPC 21230 did not open NPCScript program 15" }
            Write-Host "NPC menu opened: $menuOpened"
            Start-Sleep -Seconds 2
            Shot "shop-npc-menu"

            $greetingBefore = Get-LogLineCount $serverLog
            $clientBeforeGreeting = Get-LogLineCount $clientLog
            $greetingBeforeShot = Join-Path $shotDir "shop-npc-menu.png"
            if (-not (Test-Path -LiteralPath $greetingBeforeShot)) {
              Shot "npc-greeting-before-click"
              $greetingBeforeShot = Join-Path $shotDir "npc-greeting-before-click.png"
            }
            Write-Host "NPC greeting click basis: Run #14 1024x768 screenshot; game client screen origin=(43,66); visible greeting glyph bounds approximately x=361..451 y=553..563; physical client click=(362,492) maps to screen=(405,558)"
            Click-Client 362 492
            Start-Sleep -Seconds 3
            Shot "npc-greeting-after-click"
            $greetingAfterShot = Join-Path $shotDir "npc-greeting-after-click.png"
            $dialogueResolved = Wait-LogLine $serverLog 'offline_native_npc_menu_dialogue_resolved.*entity=21230.*program=15' $greetingBefore 2
            $ordinal0Call = Wait-LogLine $clientLog 'npc_menu_ordinal0_callsite_0x00457ADE' $clientBeforeGreeting 1
            $menuDiff = Get-DialogMenuDiff $greetingBeforeShot $greetingAfterShot
            Write-Host "NPC dialog pixel diff against pre-click screenshot: greeting=$($menuDiff.greeting) option1=$($menuDiff.option1) option2=$($menuDiff.option2)"
            if ($dialogueResolved -or $ordinal0Call) {
              Write-Host "Greeting-area click selected the ordinal-0 dialogue route; do not click another menu item in this run"
              throw "Greeting-area click dispatched ordinal 0 dialogue; inspect 49/09 and 07/01 evidence before any further input"
            }
            if ($menuDiff.option1 -lt 20 -or $menuDiff.option2 -lt 20) {
              throw "Greeting-area click did not visibly reveal both selectable menu rows; no option or purchase click attempted"
            }
            Write-Host "NPC selectable menu rows detected in screenshot: option1=$($menuDiff.option1) option2=$($menuDiff.option2)"
            Shot "npc-menu-options-visible"
            Write-Host "NPC ordinal-1 hit basis: dialog origin inferred from Run #14 screenshot and NPCScript row 0 (150,17); dialog origin logical client=(168,472); row 2 (150,35) center logical client=(418,513), screen=(461,579)"
            $shopBefore = Get-LogLineCount $serverLog
            $clientBeforeOption1 = Get-LogLineCount $clientLog
            Click-Client 418 513
            $ordinal1Call = Wait-LogLine $clientLog 'npc_menu_ordinal1_callsite_0x00457B44' $clientBeforeOption1 5
            if (-not $ordinal1Call) { Write-Host "NPC ordinal-1 callsite hook was not observed within 5 seconds; checking server confirmation" }
            $shopOpened = Wait-LogLine $serverLog 'offline_shop_opened.*entity=21230.*program=15' $shopBefore 20
            if (-not $shopOpened) { throw "Physical click at NPCScript ordinal-1 row did not open shop; inspect native call diagnostics and npc-menu-options-visible screenshot" }
            Write-Host "consumables shop opened: $shopOpened"
            Start-Sleep -Seconds 2
            Shot "shop-open"
            Shot "shop-before-purchase"

            $redBefore = Get-LogLineCount $serverLog
            Focus-Game
            [WinInput]::PressKey(0x24)
            [WinInput]::PressKey(0x0D)
            Start-Sleep -Seconds 2
            Shot "shop-red-quantity-dialog"
            Focus-Game
            [System.Windows.Forms.SendKeys]::SendWait("^a")
            [System.Windows.Forms.SendKeys]::SendWait("30")
            [System.Windows.Forms.SendKeys]::SendWait("{ENTER}")
            $redPurchase = Wait-ShopPurchase 4001 $redBefore
            if (-not $redPurchase) { throw "Recovery potion 4001 purchase of quantity 30 was not confirmed by server log" }
            Write-Host "RED POTION PURCHASE CONFIRMED: $redPurchase"
            Start-Sleep -Seconds 2
            Shot "shop-red-purchased"

            $blueBefore = Get-LogLineCount $serverLog
            Focus-Game
            [WinInput]::PressKey(0x24)
            for ($k = 0; $k -lt 4; $k++) { [WinInput]::PressKey(0x28) }
            [WinInput]::PressKey(0x0D)
            Start-Sleep -Seconds 2
            Shot "shop-blue-quantity-dialog"
            Focus-Game
            [System.Windows.Forms.SendKeys]::SendWait("^a")
            [System.Windows.Forms.SendKeys]::SendWait("30")
            [System.Windows.Forms.SendKeys]::SendWait("{ENTER}")
            $bluePurchase = Wait-ShopPurchase 4006 $blueBefore
            if (-not $bluePurchase) { throw "Magic potion 4006 purchase of quantity 30 was not confirmed by server log" }
            Write-Host "BLUE POTION PURCHASE CONFIRMED: $bluePurchase"
            Start-Sleep -Seconds 2
            Shot "shop-blue-purchased"

            Focus-Game
            [WinInput]::PressKey(0x1B)
            Start-Sleep -Seconds 1
            Click-Client 350 12
            Start-Sleep -Seconds 3
            Shot "inventory-after-potions"
            Focus-Game
            [WinInput]::PressKey(0x1B)
            Write-Host "POTION PURCHASE AUTOMATION COMPLETE: item 4001 x30 and item 4006 x30"
          }
          catch {
            $failureReason = $_.Exception.Message
            Write-Host "POTION ROUTE/AUTOMATION STOPPED: $failureReason"
            Shot "automation-stopped"
          }

          for ($i = 1; $i -le 16; $i++) {
            Start-Sleep -Seconds 30
            $n = "{0:D2}" -f $i
            Shot "shot-$n"
            $nd = Get-Process -Name NeoDark -ErrorAction SilentlyContinue
            if (-not $nd -and $i -ge 4) { Write-Host "NeoDark not running at shot $n; stopping loop"; break }
          }
          try { Stop-Process -Id $p.Id -Force -ErrorAction SilentlyContinue } catch {}
          try { Get-Process -Name NeoDark -ErrorAction SilentlyContinue | Stop-Process -Force -ErrorAction SilentlyContinue } catch {}
          try { Get-Process -Name python -ErrorAction SilentlyContinue | Where-Object { $_.Path -like "*runtime*" } | Stop-Process -Force -ErrorAction SilentlyContinue } catch {}
          Write-Host "--- NeoDark processes after stop ---"
          Get-Process -Name NeoDark -ErrorAction SilentlyContinue | Select-Object Id, ProcessName | Format-Table -AutoSize
          Write-Host "--- game stdout tail ---"
          Get-Content (Join-Path $ws "game-stdout.log") -Tail 30 -ErrorAction SilentlyContinue
          Write-Host "--- game stderr tail ---"
          Get-Content (Join-Path $ws "game-stderr.log") -Tail 30 -ErrorAction SilentlyContinue
          if ($failureReason) { throw $failureReason }

      - name: Collect logs
        shell: pwsh
        if: always()
        run: |
          New-Item -ItemType Directory -Force -Path collected | Out-Null
          Copy-Item precheck.log collected/ -ErrorAction SilentlyContinue
          Copy-Item game-stdout.log collected/ -ErrorAction SilentlyContinue
          Copy-Item game-stderr.log collected/ -ErrorAction SilentlyContinue
          Copy-Item npc-window-tree.txt collected/ -ErrorAction SilentlyContinue
          Copy-Item ybcs\runtime\logs\* collected/ -Recurse -ErrorAction SilentlyContinue
          Get-ChildItem collected -Recurse | Select-Object FullName, Length | Format-Table -AutoSize

      - name: Upload artifacts (screenshots + logs)
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ybcs-verify
          path: |
            screenshots/
            collected/
          retention-days: 30
