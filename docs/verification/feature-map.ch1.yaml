schema_version: 1
map_id: lapis-ch1-main-chain
repository: vileosbot-bot/lapis-rebuild
baseline_commit: 708e35821eb7b26721f0dd52b010eb4d59247aa1

integration_dependency:
  task_id: auto-3-1
  branch: test/ch1-e2e-acceptance
  status: BLOCKED
  acceptance_spec_path: BLOCKED
  policy: "等待总管验收 #3 后绑定其真实 spec；本文件不修改、不复制 #3 的文件。"

evidence_policy:
  source_evidence_levels:
    - RECOVERED_SECONDARY
    - INFERRED
    - RECONSTRUCTION_POLICY
    - UNVERIFIED
    - NOT_APPLICABLE
  runtime_status_values:
    - NOT_RUN
    - PASS
    - FAIL
    - BLOCKED
  unknown_binding_values:
    - BLOCKED
    - NOT_RUN
  ybcs_source_rule: "ybcs-offline 来源只能标 RECOVERED_SECONDARY 或 INFERRED；禁止标 VERIFIED。"
  separation_rule: "source_evidence_level 与 runtime_status 必须独立记录。"
  screenshot_rule: "真实网页截图与 synthetic harness 截图分开；synthetic 截图不能证明真实游戏 UI。"

